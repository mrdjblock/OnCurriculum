ficance (FOCUS ON: Economic Significance; Cause and Effect)","D3: Responsibilities of Producers: analyse some responsibilities and business practices of, and some regulations affecting, producers (FOCUS ON: Stability and Variability; Economic Perspective)","E1: Economic Inequality: analyse factors that contribute to, and programs that are intended to address, economic inequality in Canada (FOCUS ON: Economic Significance; Stability and Variability)","E2: Economic Variations among Canadian Communities: explain some of the causes and consequences of economic variations in different regions of Canada (FOCUS ON: Cause and Effect; Economic Perspective)","E3: The Local Economy: analyse some key aspects of the economy of their local community (FOCUS ON: Economic Significance; Stability and Variability)"]},"CIE3M":{"t":"The Individual and the Economy, Grade 11, University/College Preparation","o":["A1: Economic Inquiry: use the economic inquiry process and the concepts of economic thinking when investigating current economic issues in Canada","A2: Developing Transferable Skills: apply in everyday contexts skills developed through economic investigations, and identify various careers in which a background in economics might be an asset","B1: Scarcity and Choice: analyse the relationship between scarcity and choice and how these considerations affect economic decision making (FOCUS ON: Economic Significance; Cause and Effect)","B2: Economic Models: apply economic models to analyse economic choices and issues affecting Canada and Canadians (FOCUS ON: Cause and Effect; Stability and Variability)","B3: Political and Economic Systems: analyse how different political and economic systems and entities, including governments in Canada, make economic decisions (FOCUS ON: Stability and Variability; Economic Perspective)","B4: Financial Planning: demonstrate an understanding of key considerations related to personal financial planning, and use economic data to analyse the costs and benefits of personal financial decisions (FOCUS ON: Economic Significance; Economic Perspective)","C1: Market Systems: analyse how various factors, including the practices of different stakeholders, affect markets and the value of goods (FOCUS ON: Cause and Effect; Economic Perspective)","C2: Workers in Canada: explain the main roles, practices, and concerns of workers, both organized and unorganized, in Canada (FOCUS ON: Economic Significance; Economic Perspective)","C3: Employment Patterns and Trends: analyse patterns and trends related to employment and unemployment in Canada, their causes, and their impact on individuals and society (FOCUS ON: Cause and Effect; Stability and Variability)","C4: Economic Inequality: analyse causes and measures of, as well as responses to, economic inequality in Canada (FOCUS ON: Stability and Variability; Economic Perspective)","D1: Producers and Consumers: analyse ways in which producers and consumers participate in the Canadian economy and some ways in which governments affect this participation (FOCUS ON: Economic Significance; Cause and Effect)","D2: Government Intervention: analyse various ways in which governments in Canada intervene in the economy as well as factors that influence this intervention (FOCUS ON: Cause and Effect; Stability and Variability)","D3: Economic Citizenship: explain the roles, perspectives, and influence of various economic citizens in Canada (FOCUS ON: Stability and Variability; Economic Perspective)","E1: Perspectives on Scarcity and Sustainability: analyse competing perspectives on scarcity and sustainability in Canada and assess their significance (FOCUS ON: Stability and Variability; Economic Perspective)","E2: Weighing Trade-offs, Making Choices: explain the criteria that governments and firms in Canada use to weigh trade-offs and make economic choices (FOCUS ON: Cause and Effect; Stability and Variability)","E3: Economic Globalization: assess the impact of globalization, including international trade and investment, on the Canadian economy (FOCUS ON: Economic Significance; Economic Perspective)"]},"CLN4C":{"t":"Legal Studies, Grade 12, College Preparation","o":["A1: The Inquiry Process in Legal Studies: use the legal studies inquiry process and the concepts of legal thinking when investigating current legal issues","A2: Developing Transferable Skills: apply in everyday contexts skills developed through the study of law, and identify careers in which a background in law might be an asset","B1: Purpose and Processes of Law: explain purposes of law, legal structures and processes, and fundamental principles of justice in Canada (FOCUS ON: Legal Significance)","B2: Development of Law: explain how governments and societal attitudes and values have influenced the development of law in Canada (FOCUS ON: Legal Significance; Continuity and Change)","B3: Law and Diversity: analyse the ability of Canadian law to uphold the rights and accommodate the needs of diverse individuals and groups (FOCUS ON: Legal Significance; Legal Perspective)","C1: Fundamentals of Human Rights Law in Canada: explain the legal importance of human rights law in Canada, with particular reference to the Canadian Charter of Rights and Freedoms (FOCUS ON: Legal Significance)","C2: Rights and Responsibilities: analyse from a legal perspective how the rights and responsibilities of individuals, groups, and governments are connected (FOCUS ON: Interrelationships; Legal Perspective)","C3: Influences on Human Rights Issues: analyse from a legal perspective the role of forces such as globalization, technological change, media influence, and evolving societal attitudes in strengthening or weakening protections for human rights in Canada and abroad (FOCUS ON: Continuity and Change; Legal Perspective)","D1: Law and Society: analyse the role of law in contemporary society (FOCUS ON: Legal Significance)","D2: Legal Structures and Processes: describe laws and processes for dealing with different types of legal offences and disputes in Canada (FOCUS ON: Legal Significance; Interrelationships)","D3: Emerging Legal Issues: explain the legal implications of a variety of current issues, both in Canada and internationally (FOCUS ON: Continuity and Change; Legal Perspective)","E1: Law and Careers: describe the educational, training, certification, and other professional requirements for various careers where an understanding of law is important (FOCUS ON: Legal Perspective)","E2: Roles and Responsibilities in the Workplace: analyse the roles and responsibilities of employees, managers, employers, corporations, and governments in the workplace (FOCUS ON: Interrelationships; Legal Perspective)","E3: Legal Issues in the Workplace: analyse legal issues related to the influence of new technologies, environmental concerns, and national and international events on the workplace (FOCUS ON: Legal Significance; Continuity and Change; Interrelationships)"]},"CLN4U":{"t":"Canadian and International Law, Grade 12, University Preparation","o":["A1: The Inquiry Process in Legal Studies: use the legal studies inquiry process and the concepts of legal thinking when investigating legal issues in Canada and around the world, and issues relating to international law","A2: Developing Transferable Skills: apply in everyday contexts skills developed through the study of law, and identify careers in which a background in law might be an asset","B1: Principles of Law: identify foundational concepts and principles relating to law and explain their significance (FOCUS ON: Legal Significance)","B2: Legal Theory and Procedures: analyse how and to what extent various legal theories and procedures have influenced the Canadian and international legal systems (FOCUS ON: Interrelationships; Legal Perspective)","B3: Development of Law: explain various influences, including those of individuals and groups, on the development of Canadian and international law (FOCUS ON: Continuity and Change)","C1: Legal Principles of Human Rights Law: explain the principles underpinning human rights law and the legal significance of those laws, in Canada and internationally (FOCUS ON: Legal Significance)","C2: Development of Human Rights Law: analyse issues associated with the development of human rights law, in Canada and internationally (FOCUS ON: Continuity and Change)","C3: Protection of Human Rights and Freedoms: compare the roles of the legislative and judicial branches of government in protecting human rights and freedoms, with a particular emphasis on Canada (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","C4: Contemporary Issues: analyse various contemporary issues in relation to their impact or potential impact on human rights law (FOCUS ON: Legal Perspective)","D1: Fundamentals of International Law: explain the legal importance of various key principles and issues in international law (FOCUS ON: Legal Significance)","D2: Development of International Law: analyse how various factors have influenced the development of international law (FOCUS ON: Legal Significance; Continuity and Change)","D3: Conflict and Cooperation: analyse how various agreements, treaties, and conventions in international law influence international conflict and cooperation (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","E1: Criminal Law: analyse various key concepts, legal systems, and issues in criminal law, in Canada and internationally (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","E2: Environmental Protection: analyse factors that influence the effectiveness of domestic and international environmental legislation (FOCUS ON: Continuity and Change; Legal Perspective)","E3: Workplace Legal Issues: analyse legal principles, systems, and processes used to protect various parties' interests in the workplace, in Canada and internationally (FOCUS ON: Legal Significance; Interrelationships)","E4: Emerging Legal Issues: analyse emerging global issues and their implications for international law (FOCUS ON: Legal Perspective)"]},"CLU3E":{"t":"Understanding Canadian Law in Everyday Life, Grade 11, Workplace Preparation","o":["A1: The Inquiry Process in Legal Studies: use the legal studies inquiry process and the concepts of legal thinking when investigating legal issues in Canada","A2: Developing Transferable Skills: apply in everyday contexts skills developed through the study of law, and identify careers in which a background in law might be an asset","B1: Legal Principles: explain the role and importance of law and the fundamental principles of justice in Canada (FOCUS ON: Legal Significance; Interrelationships)","B2: Development of Law: describe how a variety of factors have influenced and continue to influence the development of Canadian law (FOCUS ON: Legal Significance; Continuity and Change)","C1: Human Rights: explain the legal importance of the Canadian Charter of Rights and Freedoms and the Ontario Human Rights Code and describe, in general, the procedures for resolving human rights complaints (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","C2: Development of Human Rights Law: explain the relevance of various legal issues and societal factors to the development of human rights law in Canada (FOCUS ON: Legal Significance; Continuity and Change; Legal Perspective)","D1: Introduction to Tort Law: describe the legal foundations and development of tort law and the role of individuals, groups, and courts in its processes (FOCUS ON: Legal Significance)","D2: Introduction to Family Law: describe the legal foundations and development of family law and the role of individuals, governments, and courts in its processes (FOCUS ON: Legal Significance; Continuity and Change)","D3: Introduction to Employment Law: describe the legal foundations and development of employment law and the role of employers, employees, and courts and adjudicatory tribunals in its processes (FOCUS ON: Interrelationships; Legal Perspective)","D4: Introduction to Contract Law: describe the legal foundations and development of contract law and the role of individuals, groups, and courts in its processes (FOCUS ON: Legal Significance; Legal Perspective)","E1: Foundations of Criminal Law: demonstrate an understanding of some of the foundational concepts of criminal law in Canada (FOCUS ON: Legal Significance)","E2: Legal Processes and Procedures: describe key organizational structures, roles, and steps involved in the criminal trial process, and the relationships among the various elements (FOCUS ON: Interrelationships)","E3: Development of Criminal Law: explain how various factors have influenced the development of Canadian criminal law and the criminal justice system (FOCUS ON: Continuity and Change; Legal Perspective)"]},"CLU3M":{"t":"Understanding Canadian Law, Grade 11, University/College Preparation","o":["A1: The Inquiry Process in Legal Studies: use the legal studies inquiry process and the concepts of legal thinking when investigating law and legal issues in Canada","A2: Developing Transferable Skills: apply in everyday contexts skills developed through the study of law, and identify careers in which a background in law might be an asset","B1: Legal Principles: explain the role and importance of law and the fundamental principles of justice in Canada (FOCUS ON: Legal Significance)","B2: Legal Heritage: demonstrate an understanding of early laws and legal systems and their relationship to the Canadian legal system (FOCUS ON: Interrelationships)","B3: Legal Roles and Responsibilities: analyse the role and function of individuals, groups, and governments in Canadian law (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","B4: Development of Law: analyse and describe how various social, scientific, and technological factors have influenced and continue to influence the development of Canadian law (FOCUS ON: Legal Significance; Continuity and Change)","C1: Human Rights: explain the legal significance of the Canadian Bill of Rights, the Ontario Human Rights Code, the Canadian Charter of Rights and Freedoms (the Charter), and the Canadian Human Rights Act (FOCUS ON: Legal Significance)","C2: Development of Human Rights Law: analyse how various factors have influenced and continue to influence the development of human rights law in Ontario and Canada (FOCUS ON: Continuity and Change)","C3: Protecting Rights and Freedoms: analyse the relationship between the formal, legal recognition of rights and freedoms in Canada and how those rights are interpreted and protected in practice (FOCUS ON: Legal Significance; Interrelationships; Legal Perspective)","C4: Legal Limitations of Human Rights: analyse situations in which it may be appropriate to limit rights and freedoms, and explain the arguments for and against such limitations (FOCUS ON: Legal Significance; Legal Perspective)","D1: Introduction to Tort Law: analyse the legal foundations of tort law; the factors influencing its development; and the role of individuals, groups, and courts in its processes (FOCUS ON: Legal Significance)","D2: Introduction to Family Law: analyse the legal foundations of family law; the factors influencing its development; and the role of individuals, governments, and courts in its processes (FOCUS ON: Legal Significance; Continuity and Change)","D3: Introduction to Employment Law: analyse the legal foundations of employment law; the factors influencing its development; and the role of employers, employees, and the courts in its processes (FOCUS ON: Interrelationships; Legal Perspective)","D4: Introduction to Contract Law: analyse the legal foundations of contract law; the factors influencing its development; and the role of individuals, groups, and the courts in its processes (FOCUS ON: Legal Significance; Continuity and Change; Legal Perspective)","E1: Foundations of Criminal Law: explain the foundational concepts of criminal law and their legal significance (FOCUS ON: Legal Significance)","E2: Legal Processes and Procedures: describe the structures and key roles and processes of the Canadian criminal justice system and explain key interrelationships among them (FOCUS ON: Interrelationships)","E3: Criminal Justice System: assess the ability of the Canadian criminal justice system to provide appropriate and even-handed justice to people living in Canada (FOCUS ON: Legal Perspective)","E4: Development of Criminal Law: analyse how various factors have influenced the development of Canadian criminal law (FOCUS ON: Legal Significance; Continuity and Change)"]},"CPC3O":{"t":"Politics in Action - Making Change, Grade 11, Open","o":["A1: Political Inquiry: use the political inquiry process and the concepts of political thinking when investigating issues of political importance in various communities and ways to address them","A2: Developing Transferable Skills: apply in everyday contexts skills developed through investigations related to politics, and identify some careers in which a background in political studies might be an asset","B1: Factors Affecting Political Engagement: analyse how various factors can contribute to, and present a barrier to, their own and others' political engagement (FOCUS ON: Political Significance; Political Perspective)","B2: Issues of Political Importance: explain the political importance of some current issues and analyse various perspectives associated with these issues (FOCUS ON: Political Significance; Political Perspective)","B3: Causes, Impact, and Solutions: analyse some issues of political importance in terms of their causes, their impact, and ways in which they have been addressed (FOCUS ON: Objectives and Results; Stability and Change)","C1: The Influence of Individuals and Groups: analyse the objectives and strategies, and assess the influence, of individuals and groups in addressing issues of political importance (FOCUS ON: Objectives and Results; Political Perspective)","C2: Law and Policy in Canada: analyse the impact of some key changes in Canadian law and policy as well as the process for changing laws in Canada (FOCUS ON: Objectives and Results; Stability and Change)","C3: Political Change in Democratic Societies: demonstrate an understanding of factors that facilitate and present challenges to democratic political change (FOCUS ON: Political Significance; Political Perspective)","D1: Investigating an Issue: identify and analyse a political issue, with the goal of developing a personal plan of action to address this issue (FOCUS ON: Political Significance; Political Perspective)","D2: Developing a Plan of Action: identify a goal associated with the selected issue and construct an action plan to achieve that goal (FOCUS ON: Objectives and Results; Political Perspective)","D3: Considering Outcomes: analyse and reflect on possible outcome(s) of their plan (FOCUS ON: Objectives and Results; Stability and Change)"]},"CPW4U":{"t":"Canadian and International Politics, Grade 12, University Preparation","o":["A1: Political Inquiry: use the political inquiry process and the concepts of political thinking when investigating issues, events, and developments of national and international political importance","A2: Developing Transferable Skills: apply in everyday contexts skills developed through investigations related to politics, and identify various careers in which a background in political studies might be an asset","B1: Political Thought: demonstrate an understanding of various political ideologies, theories, and concepts, and analyse their relevance to Canadian and international politics (FOCUS ON: Political Significance; Political Perspective)","B2: The Evolution of Modern Politics and International Relations: analyse the role of ideology, diplomacy, and conflict, including conflict related to decolonization, in the evolution of politics in and relations between various countries around the world in the past century (FOCUS ON: Political Significance; Stability and Change)","B3: Influences on Canadian and International Politics: analyse how social, economic, and geographic factors influence contemporary politics in and relations between various countries around the world (FOCUS ON: Objectives and Results; Political Perspective)","C1: The International Influence of Governments: analyse how strategies/practices used by a state or states can affect the policies and status of other states (FOCUS ON: Political Significance; Objectives and Results)","C2: Intergovernmental Cooperation: demonstrate an understanding of the role of intergovernmental cooperation in international politics (FOCUS ON: Objectives and Results; Stability and Change)","C3: Canadian Government Policies and International Relations: analyse Canada's foreign policy objectives and factors that affect them (FOCUS ON: Objectives and Results; Political Perspective)","D1: Civic Awareness and Responsibility: analyse the role of civic awareness and responsibility among citizens and non-governmental stakeholders in the national and international community (FOCUS ON: Political Significance; Political Perspective)","D2: Challenges and Strategies: demonstrate an understanding of key challenges relating to various issues of national and global political importance and of the strategies and effectiveness of various non-governmental stakeholders, including NGOs, in addressing them (FOCUS ON: Objectives and Results; Political Perspective)","D3: Contributions to the Global Community: assess the importance of the contributions of individuals and other non-governmental stakeholders to national and global communities (FOCUS ON: Objectives and Results; Stability and Change)","E1: Influence, Power, and Decision Making: demonstrate an understanding of how power is distributed and exercised in Canada and other countries, and of factors that affect its distribution (FOCUS ON: Political Significance; Objectives and Results)","E2: Technology and Globalization: assess the influence of globalization and technology on Canadian and international politics (FOCUS ON: Stability and Change; Political Perspective)","E3: Human Rights at Home and Abroad: explain violations of human rights in Canada and abroad as well as the role of Canadian and international laws, institutions, and processes in the protection of human rights (FOCUS ON: Political Significance; Stability and Change)"]},"CGC1D":{"t":"Issues in Canadian Geography, Grade 9, Academic","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating issues relating to Canadian geography","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial technology skills, developed through the investigation of Canadian geography, and identify some careers in which a background in geography might be an asset","B1: The Physical Environment and Human Activities: analyse various interactions between physical processes, phenomena, and events and human activities in Canada (FOCUS ON: Interrelationships; Geographic Perspective)","B2: Interrelationships between Physical Systems, Processes, and Events: analyse characteristics of various physical processes, phenomena, and events affecting Canada and their interrelationship with global physical systems (FOCUS ON: Patterns and Trends; Interrelationships)","B3: The Characteristics of Canada's Natural Environment: describe various characteristics of the natural environment and the spatial distribution of physical features in Canada, and explain the role of physical processes, phenomena, and events in shaping them (FOCUS ON: Spatial Significance; Patterns and Trends)","C1: The Sustainability of Resources: analyse impacts of resource policy, resource management, and consumer choices on resource sustainability in Canada (FOCUS ON: Interrelationships; Geographic Perspective)","C2: The Development of Resources: analyse issues related to the distribution, y, and identify some careers in which a background in geography might be an asset","B1: Natural Processes and Human Activity: analyse some interactions between physical processes, events, and phenomena and human activities in Canada (FOCUS ON: Interrelationships; Geographic Perspective)","B2: Influence of the Natural Environment on Human Activity: explain how physical processes and the natural environment influence human activity in Canada (FOCUS ON: Spatial Significance; Interrelationships)","B3: Characteristics of Canada's Natural Environment: describe some natural processes and key characteristics of the natural environment in Canada (FOCUS ON: Spatial Significance; Patterns and Trends)","C1: Managing Resources: assess the influence of personal choices and community actions on the use of natural resources in Canada (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Canadian Industries: describe the economic, environmental, social, and political significance of selected aspects of Canada's resources and industries (FOCUS ON: Patterns and Trends; Geographic Perspective)","C3: The Use of Natural Resources: describe the distribution and use of selected natural resources in Canada (FOCUS ON: Spatial Significance; Interrelationships)","D1: Population Trends and Their Impacts: assess the impact on Canadian communities of changes in the characteristics of Canada's population, and describe ways of responding to these changes (FOCUS ON: Patterns and Trends; Geographic Perspective)","D2: Immigration Trends: analyse recent immigration trends in Canada (FOCUS ON: Interrelationships; Patterns and Trends)","D3: Population Characteristics: describe key characteristics of population settlements in Canada and the major demographic characteristics of the Canadian population (FOCUS ON: Spatial Significance; Patterns and Trends)","E1: Sustainable Communities: identify factors that affect the sustainability of communities, and describe strategies for improving their sustainability (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Impacts of Land Use: analyse impacts of land use in Canada on communities and the natural environment (FOCUS ON: Spatial Significance; Interrelationships)","E3: Patterns of Land Use: describe patterns of land use in their local community (FOCUS ON: Spatial Significance; Patterns and Trends)"]},"CGC1W":{"t":"Exploring Canadian Geography, Grade 9, De-streamed","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating issues relating to Canadian geography","A2: Developing Transferable Skills: apply in everyday contexts skills, including geospatial technology skills, developed through the investigation of Canadian geography, and identify some careers, including those in the skilled trades, in which a background in geography might be an asset","B1: Characteristics of Canada's Natural Environment and the Impact of Physical Processes: describe various characteristics of the natural environment and the spatial distribution of physical features in Canada, and analyze the role of physical processes, phenomena, and events in shaping them (FOCUS ON: Spatial Significance; Patterns and Trends)","B2: Interactions between the Natural Environment and Human Activities: analyze interrelationships between physical processes, phenomena, and events and the ways in which various communities in Canada respond to and interact with them (FOCUS ON: Interrelationships; Geographic Perspective)","C1: Natural Resources and Industries in Canada: analyze characteristics of natural resources and industries in Canada, and factors that affect the accessibility and use of natural resources and the location of industries (FOCUS ON: Spatial Significance; Interrelationships)","C2: Sustainability and Economic Development: analyze issues related to the sustainable development of resources and industries in Canada (FOCUS ON: Patterns and Trends; Geographic Perspective)","D1: Demographic Patterns and Trends: analyze key patterns and trends in demographics and population movement and settlement, and factors that affect these patterns and trends, nationally and for various populations in Canada (FOCUS ON: Patterns and Trends; Interrelationships)","D2: Population Issues: analyze selected national and global population issues and their implications for Canada and for various people who live in Canada (FOCUS ON: Spatial Significance; Geographic Perspective)","E1: Land Use in Communities: analyze characteristics and impacts of land use in various communities in Canada, including urban communities, and factors affecting land use and land-use planning (FOCUS ON: Spatial Significance; Patterns and Trends)","E2: Sustainability of Human Systems and Communities: analyze issues relating to, and strategies for improving, the sustainability of human systems and communities in Canada (FOCUS ON: Interrelationships; Geographic Perspective)"]},"CHC2D":{"t":"Canadian History since World War I, Grade 10, Academic","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of Canadian history since 1914","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify some careers in which these skills might be useful","B1: Social, Economic, and Political Context: describe some key social, economic, and political events, trends, and developments between 1914 and 1929, and assess their significance for different groups and communities in Canada, including First Nations, Métis, and Inuit communities (FOCUS ON: Historical Significance; Historical Perspective)","B2: Communities, Conflict, and Cooperation: analyse some key interactions within and between different communities in Canada, including First Nations, Métis, and Inuit communities, and between Canada and the international community, from 1914 to 1929, and how these interac standing of other cultures and fields of study, the contemporary world, and their own experience","C1: History: demonstrate knowledge and understanding of the political and social history of societies in the classical world","C2: Geography: demonstrate knowledge and understanding of the geography of the classical world and its influence on the development of classical culture","C3: Terminology: identify historical and geographical terminology in English derived from ancient Greek and Latin, including political and legal terminology, and use it correctly","C4: Intercultural and Other Connections: describe how their learning about the history and geography of the classical world relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and their own experience","D1: Philosophy: demonstrate knowledge and understanding of the schools of classical philosophy and of classical contributions to the development of scientific inquiry","D2: Religion: demonstrate knowledge and understanding of the diverse religions and religious rituals of the Graeco-Roman world","D3: Terminology: identify philosophical, scientific, and religious terminology in English derived from ancient Greek and Latin and use it correctly","D4: Intercultural and Other Connections: describe how their learning about classical philosophy, science, and religion relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and their own experience","E1: Archaeology: demonstrate knowledge and understanding of archaeological history, practices, and issues, and the physical remains or artefacts related to classical sites","E2: Classical Culture: make inferences about the social structures, customs, and technological achievements of classical societies based on information derived from their material culture","E3: Terminology: identify archaeological, aesthetic, and architectural terms in English derived from ancient Greek and Latin and use them correctly","E4: Intercultural and Other Connections: describe how their learning about classical material culture relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and personal experience"]},"ICD2O":{"t":"Digital Technology and Innovations in the Changing World, Grade 10, Open","o":["A1: Computational Thinking, Planning, and Purpose: apply computational thinking concepts and practices, and use various tools and processes to plan and develop computational artifacts for a wide variety of contexts, users, and purposes","A2: Digital Technology and Society: demonstrate an understanding of important social, cultural, economic, environmental, and ethical issues, as well as contributions and innovations involving diverse local and global communities, related to digital technology","A3: Applications, Careers, and Connections: demonstrate an understanding of real-world applications of digital technology and programming, including within various industries and careers","B1: Understanding Hardware and Software: demonstrate an understanding of the functions and features of the hardware and software they encounter in their everyday life","B2: Using Hardware and Software: demonstrate an understanding of various ways to use hardware, software, and file management, and of research practices to support their own use of digital technology","B3: Cybersecurity and Data: demonstrate an understanding of safe and effective practices related to data and cybersecurity in various contexts","B4: Innovations in Digital Technology: investigate current and emerging innovations in digital technology, including automation and artificial intelligence, and assess their benefits and limitations","C1: Programming Concepts and Algorithms: explain fundamental programming concepts and algorithms","C2: Writing Programs: use fundamental programming concepts to write simple programs","C3: Modularity and Modification: demonstrate an understanding of program components and modules"]},"ICS2O":{"t":"Introduction to Computer Studies, Grade 10, Open","o":["A1: Hardware Components: describe the functions of different types of hardware components, and assess the hardware needs of users","A2: Software Products: describe the different types of software products, and assess the software needs of users","A3: Operating Systems: use the basic functions of an operating system correctly","A4: Home Computer Networking: demonstrate an understanding of home computer networking concepts","A5: Maintenance and Security: explain the importance of software updates and system maintenance to manage the performance and increase the security of a computer","B1: Programming concepts: describe fundamental programming concepts and constructs","B2: Writing Programs: plan and write simple programs using fundamental programming concepts","B3: Code Maintenance: apply basic code maintenance techniques when writing programs","C1: Social impact: describe key aspects of the impact of computers and related technologies on society","C2: Environmental Stewardship and Sustainability: describe computer use policies that promote environmental stewardship and sustainability","C3: Ethical issues: describe legal and ethical issues related to the use of computing devices","C4: Postsecondary opportunities: describe postsecondary education and career prospects related to computer studies"]},"ICS3C":{"t":"Introduction to Computer Programming, Grade 11, College Preparation","o":["A1: Data Types and Expressions: demonstrate the ability to use different data types in expressions in simple computer programs","A2: Control Structures and Simple Algorithms: demonstrate the ability to use control structures and simple algorithms in computer programs","A3: Code Maintenance: use proper code maintenance techniques and conventions when creating computer programs","B1: Problem-solving Strategies: use a variety of problem-solving strategies to solve different types of problems","B2: Designing Software Solutions: design software solutions to meet a variety of challenges, using a set of standards","B3: Designing Simple Algorithms: design simple algorithms according to specifications","B4: The Software Development Life Cycle: apply a software development life-cycle model to a software development project","C1: Computer Components: demonstrate an understanding of the functions of different types of computer components","C2: File maintenance: use appropriate file maintenance practices to organize and safeguard data","C3: The Software Development Environment: use a software development environment to write and run computer programs","D1: Environmental Stewardship and Sustainability: describe computer use policies that promote environmental stewardship and sustainability","D2: Safe computing: describe and apply procedures for safe computing to safeguard computer users and their data","D3: Emerging technologies: explain key aspects of the impact that emerging technologies have on society","D4: Postsecondary opportunities: describe postsecondary education and career prospects related to computer studies"]},"ICS3U":{"t":"Introduction to Computer Science, Grade 11, University Preparation","o":["A1: Data Types and Expressions: demonstrate the ability to use different data types, including one-dimensional arrays, in computer programs","A2: Control Structures and Simple Algorithms: demonstrate the ability to use control structures and simple algorithms in computer programs","A3: Subprograms: demonstrate the ability to use subprograms within computer programs","A4: Code Maintenance: use proper code maintenance techniques and conventions when creating computer programs","B1: Problem-solving Strategies: use a variety of problem-solving strategies to solve different types of problems independently and as part of a team","B2: Designing Software Solutions: design software solutions to meet a variety of challenges","B3: Designing Algorithms: design algorithms according to specifications","B4: The Software Development Life Cycle: apply a software development life-cycle model to a software development project","C1: Computer Components: relate the specifications of computer components to user requirements","C2: File maintenance: use appropriate file maintenance practices to organize and safeguard data","C3: Software development: demonstrate an understanding of the software development process","D1: Environmental Stewardship and Sustainability: describe policies on computer use that promote environmental stewardship and sustainability","D2: Exploring computer Science: demonstrate an understanding of emerging areas of computer science research","D3: Postsecondary opportunities: describe postsecondary education and career prospects related to computer studies"]},"ICS4C":{"t":"Computer Programming, Grade 12, College Preparation","o":["A1: Data Structures: use data structures in the design and creation of computer programs","A2: Using Standard Algorithms: demonstrate the ability to use standard algorithms in the design and creation of computer programs","A3: Object-oriented Programming: demonstrate an understanding of object-oriented programming concepts and practices in the design and creation of computer programs","A4: Code Maintenance: create clear and accurate internal and external documentation to ensure the maintainability of computer software","B1: Designing Standard Algorithms: design standard algorithms according to specifications","B2: Object-oriented Software Solutions: design software solutions using object-oriented programming concepts","B3: Graphical user interfaces: design user-friendly graphical user interfaces (GUIs) that meet user requirements","B4: Student-managed Project: participate in a large student-managed project, using proper project management tools and techniques to manage the process effectively","C1: Project management tools: demonstrate the ability to use project management ers and related technologies","D2: Ethical Practices: analyse ethical issues and propose strategies to encourage ethical practices related to the use of computers","D3: Emerging technologies and Society: analyse the impact of emerging computer technologies on society and the economy","D4: Exploring computer Science: research and report on different areas of research in computer science, and careers related to computer science"]},"COOP-LINKED":{"t":"Cooperative Education Linked to a Related Course (or Courses), Grade 11 or 12","o":["A1: Health, Safety, and Well-Being: demonstrate an understanding of legislation, practices, and behaviours related to health, safety, and well-being in connection with the cooperative education experience","A2: Preparing and Planning for the Experience: demonstrate an understanding of requirements and various considerations related to the cooperative education experience, in preparation for the experience","B1: The Student's Cooperative Education Learning Plan: develop, implement, and reflect on a learning plan, including learning related to health, safety, and well-being and to relevant expectations from the related course or courses, to maximize success in the cooperative education experience","B2: Skills for the Future: demonstrate the skills and knowledge developed or refined through the cooperative education experience, including skills and knowledge related to health, safety, and well-being and to relevant expectations from the related course or courses, and explain how they might use what they have learned in other aspects of their lives, now and in the future"]},"DCO3O":{"t":"Creating Opportunities through Co-op, Grade 11, Open","o":["A1: Health, Safety, and Well-Being: demonstrate an understanding of legislation, practices, and behaviours related to health, safety, and well-being in connection with the cooperative education experience","A2: Preparing and Planning for the Experience: demonstrate an understanding of requirements and various considerations related to the cooperative education experience, in preparation for the experience","B1: The Student's Cooperative Education Learning Plan: develop, implement, and reflect on a learning plan, including learning related to health, safety, and well-being, to maximize success in the cooperative education experience","B2: Skills for the Future: demonstrate the skills and knowledge developed or refined through the cooperative education experience, including skills and knowledge related to health, safety, and well-being, and explain how they might use what they have learned in other aspects of their lives, now and in the future","C1: Exploration and Investigation: explore and investigate a topic, issue, or process relevant to the cooperative education experience, formulating questions to guide research, gathering information, and making connections to the cooperative education experience","C2: Analysis and Communication: analyse the information gathered through the investigation and communicate results, making connections to the cooperative education experience and other current and future endeavours","D1: Decision Making: demonstrate an understanding of decision making and analyse how the decisions they make can impact their cooperative education experience and their future endeavours","D2: Leadership: demonstrate an understanding of effective leadership and how they can incorporate it into their lives"]},"ELDAO":{"t":"English Literacy Development, ELD Level 1, Open","o":["A1: Developing Listening: demonstrate the ability to understand, interpret, and evaluate spoken English for a variety of purposes","A2: Developing Fluency in Speaking: use speaking skills and strategies to communicate in English for a variety of classroom and social purposes","A3: Developing Accuracy in Speaking: use correctly the language structures appropriate for this level to communicate orally in English","B1: Reading for Meaning: read and demonstrate understanding of a va erspectives that influence the reading experience","4: Literary Criticism: use literary criticism to enhance their understanding of Canadian literature","5: The Role of Literature in Society: assess the importance of Canadian literature as a social and cultural force"]},"ETS4C":{"t":"Studies in Literature, Grade 12, College Preparation","o":["1: Understanding Texts: read and demonstrate understanding of a variety of literary texts from different countries, cultures, and historical periods","2: Analysing Texts: respond to and analyse literary texts to develop and extend their understanding of how content, form, and style in combination communicate meaning and enhance a text's effectiveness","3: Critical Literacy: demonstrate an understanding that the perspective of the author, the reader, and the text all influence the reading experience","4: Literary Criticism: use literary criticism to enhance their understanding of literature","5: The Role of Literature in Society: assess the importance of literature as a social and cultural force"]},"ETS4U":{"t":"Studies in Literature, Grade 12, University Preparation","o":["1: Understanding Texts: read and demonstrate an understanding of a variety of literary texts from different countries, cultures, and historical periods","2: Analysing Texts: respond to and analyse literary texts to develop and extend their understanding of how content, form, and style in combination communicate meaning and enhance a text's effectiveness","3: Critical Literacy: demonstrate an understanding that the perspective of the author, the reader, and the text all influence the reading experience","4: Literary Criticism: use literary criticism to enhance their understanding of literature","5: The Role of Literature in Society: assess the importance of literature as a social and cultural force"]},"EWC4C":{"t":"The Writer's Craft, Grade 12, College Preparation","o":["A1: Writing, Writers, and the Writing Life: demonstrate an understanding of writing as an nderstanding of how the seven transferable skills (critical thinking and problem solving; innovation, creativity, and entrepreneurship; self-directed learning; collaboration; communication; global citizenship and sustainability; and digital literacy) are used in various language and literacy contexts","A2: Digital Media Literacy: demonstrate and apply the knowledge and skills needed to interact safely and responsibly in online environments, use digital and media tools to construct knowledge, and demonstrate learning as critical consumers and creators of media","A3: Applications, Connections, and Contributions: apply language and literacy skills in cross-curricular and integrated learning, and demonstrate an understanding of, and make connections to, diverse voices, experiences, perspectives, histories, and contributions, including those of First Nations, Métis, and Inuit individuals, communities, groups, and nations","B1: Oral and Non-Verbal Communication: apply listening, speaking, and non-verbal communication skills and strategies to understand and communicate meaning in formal and informal contexts and for various purposes and audiences","B2: Language Foundations for Reading and Writing: demonstrate an understanding of foundational language knowledge and skills, and apply this understanding when reading and writing","B3: Language Conventions for Reading and Writing: demonstrate an understanding of sentence structure, grammar, cohesive ties, and capitalization and punctuation, and apply this knowledge when reading and writing sentences, paragraphs, and a variety of texts For an at-a-glance view of the mandatory learning across grades, see Appendix: Language Conventions for Reading and Writing Continuum, Grades 1–9, Overall Expectation B3","C1: Knowledge about Texts: apply foundational knowledge and skills to understand a variety of texts, including digital and media texts, by creators with diverse identities, perspectives, and experience, and demonstrate an understanding of the patterns, features, and elements of style associated with various text forms and genres","C2: Comprehension Strategies: apply comprehension strategies before, during, and after reading, listening to, and viewing a variety of texts, including digital and media texts, by creators with diverse identities, perspectives, and experience, in order to understand and clarify the meaning of texts","C3: Critical Thinking in Literacy: apply critical thinking skills to deepen understanding of texts, and analyze how various perspectives and topics are communicated and addressed in a variety of texts, including digital, media, and cultural texts","D1: Developing Ideas and Organizing Content: plan, develop ideas, gather information, and organize content for creating texts of various forms, including digital and media texts, on a variety of topics","D2: Creating Texts: apply knowledge and understanding of various text forms and genres to create, revise, edit, and proofread their own texts, using a variety of media, tools, and strategies, and reflect critically on created texts","D3: Publishing, Presenting, and Reflecting: select suitable and effective media, techniques, and tools to publish and present final texts, and critically analyze how well the texts address various topics"]},"NAC1O":{"t":"Expressions of First Nations, Métis, and Inuit Cultures, Grade 9, Open","o":["A1: The People and the Land: demonstrate an understanding of the spiritual interconnectedness of people, the land, and the natural world in First Nations, Métis, and Inuit world views, analysing how spiritual and personal connections to the land are expressed through various art forms and arts disciplines","A2: Identities: demonstrate an understanding of the role of spiritual, individual, gender, and collective identities in First Nations, Métis, and Inuit world views, analysing how identity is expressed through various art forms and arts disciplines","A3: Self-Determination and Nationhood: demonstrate an understanding of the role of sovereignty, self-governance, and nationhood in First Nations, Métis, and Inuit world views, analysing how self-determination is expressed through various art forms and arts disciplines","B1: The Creative Process: apply the creative process individually and/or collaboratively to create art works, including integrated art works/productions, that draw on their exploration of First Nations, Métis, and Inuit perspectives to express their own personal world views, histories, or cultures","B2: Elements and Principles: apply key elements and principles from various arts disciplines, as reflected in First Nations, Métis, and Inuit art forms, when creating, modifying, and presenting art works, including integrated art works/productions","B3: Materials, Tools, Techniques, and Technologies: use a variety of traditional and contemporary materials, tools, techniques, and technologies to create art works, including integrated art works/productions, that demonstrate creativity","B4: Presentation and Promotion: present and promote art works, including integrated art works/productions, for a variety of purposes, respecting First Nations, Métis, and Inuit cultural protocols and using appropriate technologies and conventions","C1: Terminology: demonstrate an understanding of, and use proper terminology when referring to, elements, principles, and other key concepts related to various arts disciplines, as reflected in First Nations, Métis, and Inuit art forms","C2: Themes and Influences: demonstrate an understanding of past and present themes and influences associated with First Nations, Métis, and Inuit art making, as reflected in a variety of art works/productions","C3: Conventions and Responsible Practices: demonstrate an understanding of conventions and responsible practices associated with various arts disciplines, and with art making within First Nations, Métis, and Inuit cultures, and apply these practices when experiencing, analysing, creating, and presenting art works/productions","C4: The Critical Analysis Process: demonstrate an understanding of the critical analysis process by applying it to the study of art works/productions from various arts disciplines, including their own works, the works of their peers, and works by First Nations, Métis, and Inuit artists","D1: Art Forms and Society: demonstrate an understanding of how past and present First Nations, Métis, and Inuit art forms reflect the societies and periods in which they were created","D2: Promoting Renewal, Healing, Reconciliation, and Dialogue: demonstrate an understanding of how art making and art works can promote renewal and healing in First Nations, Métis, and Inuit communities and reconciliation and dialogue with non-Indigenous communities","D3: Connections beyond the Classroom: describe the skills developed through creating, presenting, and analysing art works that explore First Nations, Métis, and Inuit perspectives, including integrated art works/productions, and identify various opportunities to pursue artistic endeavours beyond the classroom"]},"NAC2O":{"t":"First Nations, Métis, and Inuit in Canada, Grade 10, Open","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of the history of Indigenous peoples within the boundaries of contemporary Canada from precontact to the present day","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify some careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse some key political alliances as well as key aspects of social and economic life among some First Nations and Inuit societies prior to 1500 in different regions of what would be called North America, with a particular focus on societies in the territories that would become Canada (FOCUS ON: Continuity and Change; Historical Perspective)","B2: Communities, Conflict, and Cooperation: demonstrate an understanding of some key interactions and settlement patterns of major First Nations and Inuit societies prior to 1500 in different regions of what would be called North America, with a particular focus on societies in the territories that would become Canada (FOCUS ON: Historical Significance; Cause and Consequence)","B3: Identities, Cultures, and Self-Determination: analyse how various factors contributed to the identities, well-being, and heritage of some First Nations and Inuit societies prior to 1500 in different regions of what would be called North America, with a particular focus on societies in the territories that would become Canada (FOCUS ON: Historical Significance; Historical Perspective)","C1: Social, Economic, and Political Context: analyse some key social, economic, and political developments that affected Indigenous peoples in different regions of Canada between 1500 and 1763, and some changes that resulted from these developments (FOCUS ON: Cause and Consequence; Continuity and Change)","C2: Communities, Conflict, and Cooperation: analyse interactions among Indigenous peoples and between Indigenous peoples and European colonists and governments in different regions of Canada between 1500 and 1763, as well as some factors that affected these interactions (FOCUS ON: Historical Significance; Historical Perspective)","C3: Identities, Cultures, and Self-Determination: analyse how attitudes, beliefs, and values of Indigenous and European peoples affected First Nations and Métis individuals and communities in different regions of Canada between 1500 and 1763 (FOCUS ON: Cause and Consequence; Historical Perspective)","D1: Social, Economic, and Political Context: describe some key social, economic, and political issues, trends, and developments that affected Indigenous peoples in different regions of Canada between 1763 and 1876, and analyse their impact (FOCUS ON: Historical Significance; Continuity and Change)","D2: Communities, Conflict, and Cooperation: describe some key developments in relations between Indigenous peoples, settlers, and colonial/dominion governments in different regions of Canada between 1763 and 1876, and explain their significance (FOCUS ON: Historical Significance; Cause and Consequence)","D3: Identities, Cultures, and Self-Determination: analyse how beliefs, values, and the contributions of various individuals and groups helped shape the development of Indigenous rights, identities, and heritage in different regions of Canada between 1763 and 1876 (FOCUS ON: Cause and Consequence; Historical Perspective)","E1: Social, Economic, and Political Context: describe some key social, economic, and political issues, trends, and developments, including the Indian Act, that affected Indigenous peoples in Canada between 1876 and 1969, and analyse their impact (FOCUS ON: Cause and Consequence; Historical Perspective)","E2: Communities, Conflict, and Cooperation: analyse various factors that affected interactions between Indigenous and non-Indigenous people in Canada between 1876 and 1969 (FOCUS ON: Historical Significance; Continuity and Change)","E3: Identities, Cultures, and Self-Determination: analyse how various individuals, groups, and issues contributed to the development of Indigenous identities, cultures, and rights in Canada between 1876 and 1969 (FOCUS ON: Cause and Consequence; Historical Perspective)","F1: Social, Economic, and Political Context: describe some key social, economic, and political issues, trends, and developments that have affected Indigenous peoples in Canada from 1969 to the present, and analyse their impact (FOCUS ON: Historical Significance; Continuity and Change)","F2: Communities, Conflict and Cooperation: analyse various legal and demographic developments involving Indigenous peoples in Canada, as well as responses to them, from 1969 to the present (FOCUS ON: Cause and Consequence; Continuity and Change)","F3: Identities, Cultures, and Self-Determination: analyse how various individuals, groups, and issues have contributed to the development of Indigenous identities, cultures, and rights in Canada since 1969 (FOCUS ON: Historical Significance; Historical Perspective)"]},"NBE3C":{"t":"English - Understanding Contemporary First Nations, Métis, and Inuit Voices, Grade 11, College Preparation","o":["A1: Exploring: explore themes related to First Nations, Métis, and Inuit identities, relationships, and self-determination, sovereignty, or self-governance, as reflected in text forms created in Canada, formulating questions and comparing perspectives to stimulate a well-reasoned exchange of ideas about these topics","A2: Deconstructing: demonstrate an understanding of how representations of First Nations, Métis, and Inuit individuals, communities, and cultures in text forms created in Canada are influenced by perspectives related to or shaped by historical period, cultural background, and social and political conditions and events, including perspectives related to gender and the role of women","A3: Reconstructing: demonstrate an understanding of the role of contemporary and historical text forms created in Canada in representing the diversity of First Nations, Métis, and Inuit lives, cultures, and world views, and assess the impact on Canadian society of efforts to challenge colonialist views and incomplete or inaccurate representations","B1: The Oral Tradition: demonstrate an understanding of text forms, figures, and practices associated with the oral traditions of First Nations, Métis, and Inuit cultures, explaining how these traditions communicate meaning and how they are used in contemporary communities, and demonstrate the use of culturally appropriate listening practices","B2: Listening to Understand: listen to oral texts from and/or related to First Nations, Métis, and Inuit cultures in order to understand and respond appropriately in a variety of situations for a variety of purposes","B3: Speaking to Communicate: use speaking skills and strategies appropriately to communicate with different audiences, for a variety of purposes, about themes, ideas, and issues related to First Nations, Métis, and Inuit cultures","B4: Reflecting on Skills and Strategies: reflect on and identify their strengths as listeners and speakers, areas for improvement, and the strategies they found most helpful in oral communication contexts related to First Nations, Métis, and Inuit cultures","C1: Reading for Meaning: read and demonstrate an understanding of a variety of literary, informational, and graphic texts from First Nations, Métis, and Inuit cultures, and, as appropriate, relevant texts from non-Indigenous sources, using a range of strategies to construct meaning","C2: Understanding Form and Style: identify a variety of text forms, text features, and stylistic elements in texts from First Nations, Métis, and Inuit cultures, and, as appropriate, relevant texts from non-Indigenous sources, and demonstrate an understanding of how they help communicate meaning","C3: Reading with Fluency: use knowledge of words and cueing systems to read fluently","C4: Reflecting on Skills and Strategies: reflect on and identify their strengths as readers, areas for improvement, and the strategies they found most helpful before, during, and after reading texts from First Nations, Métis, and Inuit cultures, and, as appropriate, texts from non-Indigenous sources","C5: First Nations, Métis, and Inuit Voices in Contemporary Literature: identify various contributions of individuals, organizations, and initiatives, including technological initiatives, to the development of contemporary First Nations, Métis, and Inuit literature, and analyse the social and cultural influence of those contributions","D1: Developing and Organizing Content: generate, gather, and organize ideas and information to write for an intended purpose and audience on subject matter related to First Nations, Métis, and Inuit cultures","D2: Using Knowledge of Form and Style: draft and revise their writing, using a variety of literary, informational, and graphic forms and stylistic elements appropriate for the purpose and audience","D3: Applying Knowledge of Conventions: use editing, proofreading, and publishing skills and strategies, and knowledge of language conventions, to correct errors, refine expression, and present their work effectively","D4: Reflecting on Skills and Strategies: reflect on and identify their strengths as writers, areas for improvement, and the strategies they found most helpful at different stages of writing texts on subject matter related to First Nations, Métis, and Inuit cultures","E1: Understanding Media Texts: demonstrate an understanding of a variety of media texts from First Nations, Métis, and Inuit cultures, and, as appropriate, relevant media texts from non-Indigenous sources","E2: Understanding Media Forms, Conventions, and Techniques: identify some media forms and explain how the conventions and techniques associated with them are used to create meaning in the context of First Nations, Métis, and Inuit cultures","E3: Creating Media Texts: create a variety of media texts on subject matter related to First Nations, Métis, and Inuit cultures, for different purposes and audiences, using appropriate forms, conventions, and techniques","E4: Reflecting on Skills and Strategies: reflect on and identify their strengths as interpreters and creators of media texts, areas for improvement, and the strategies they found most helpful in understanding and creating media texts on subject matter related to First Nations, Métis, and Inuit cultures","E5: First Nations, Métis, and Inuit Voices in Contemporary Media: identify various contributions of individuals, organizations, and initiatives, including technological initiatives, to the development of contemporary First Nations, Métis, and Inuit media production, analysing the social and cultural influence of thos formulating critical questions to guide their research and inquiry","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics from a variety of sources, using appropriate research and inquiry methods and respecting Indigenous knowledge and ways of knowing","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry, respecting Indigenous knowledge and ways of knowing","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: The Concept of World View: demonstrate an understanding of the elements, purposes, and functions of a world view or belief system, and explore the role of world view in daily life in Canada","B2: First Nations, Métis, and Inuit World Views: demonstrate an understanding of how language, culture, and the relationship between people and place shape and reflect First Nations, Métis, and Inuit world views, identifying key elements of the beliefs, values, and customs associated with diverse cultures","B3: Cultural Awareness Skills and Strategies: use cultural awareness skills and strategies appropriately when exploring First Nations, Métis, and Inuit ways of knowing, world views, and contributions to society","C1: Colonialism and Colonization: demonstrate an understanding of the concept of colonialism, and of the past and present impact of colonization and related government policies in Canada","C2: Decolonization, Resilience, and Social Change: demonstrate an understanding of the key concepts and goals of decolonization and resilience, analysing various strategies to raise awareness of the impact of colonialist policies and to sustain First Nations, Métis, and Inuit world views, aspirations, and actions in the context of social change","D1: Reclaiming Traditional Beliefs, Values, and Customs: demonstrate an understanding of how individuals, families, institutions, and communities are reclaiming a place for First Nations, Métis, and Inuit beliefs, values, and customs in contemporary life","D2: Truth, Reconciliation, and Renewal: demonstrate an understanding of how building recognition and respect for First Nations, Métis, and Inuit knowledge, world views, and aspirations contributes to truth, reconciliation, and renewed nation-to-nation relationships","D3: Aspirations and Social Action: demonstrate an understanding of how key First Nations, Métis, and Inuit aspirations for communities, for Canada, and for global society reflect traditional and contemporary beliefs and values, and analyse the role of social action in supporting those goals"]},"NBV3E":{"t":"World Views and Aspirations of First Nations, Métis, and Inuit Communities in Canada, Grade 11, Workplace Preparation","o":["A1: Exploring: explore topics related to the knowledge, world views, and aspirations that shape the actions of First Nations, Métis, and Inuit individuals and communities, identifying key concepts and formulating critical questions to guide their research and inquiry","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics from a variety of sources, using appropriate research and inquiry methods and respecting Indigenous knowledge and ways of knowing","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry, respecting Indigenous knowledge and ways of knowing","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: The Concept of World View: demonstrate an understanding of the elements, purposes, and functions of a world view or belief system, and explore the role of world view in daily life in Canada","B2: First Nations, Métis, and Inuit World Views: demonstrate an understanding of how language, culture, and the relationship between people and place shape and reflect First Nations, Métis, and Inuit world views, identifying key elements of the beliefs, values, and customs associated with diverse cultures","B3: Cultural Awareness Skills and Strategies: use cultural awareness skills and strategies appropriately when exploring First Nations, Métis, and Inuit ways of knowing, world views, and contributions to society","C1: Colonialism and Colonization: demonstrate an understanding of the concept of colonialism, and of the past and present impact of colonization and related government policies in Canada","C2: Decolonization, Resilience, and Social Change: demonstrate an understanding of the key concepts and goals of decolonization and resilience, analysing various strategies to raise awareness of the impact of colonialist policies and to sustain First Nations, Métis, and Inuit world views, aspirations, and actions in the context of social change","D1: Reclaiming Traditional Beliefs, Values, and Customs: demonstrate an understanding of how individuals, families, institutions, and communities are reclaiming a place for First Nations, Métis, and Inuit beliefs, values, and customs in contemporary life","D2: Truth, Reconciliation, and Renewal: demonstrate an understanding of how building recognition and respect for First Nations, Métis, and Inuit knowledge, world views, and aspirations contributes to truth, reconciliation, and renewed nation-to-nation relationships","D3: Aspirations and Social Action: demonstrate an understanding of how key First Nations, Métis, and Inuit aspirations for communities, for Canada, and for global society reflect traditional and contemporary beliefs and values, and analyse the role of social action in supporting those goals"]},"NDA3M":{"t":"Contemporary First Nations, Métis, and Inuit Issues and Perspectives, Grade 11, University/College Preparation","o":["A1: Political Inquiry: use the political inquiry process and the concepts of political thinking when investigating contemporary issues, events, and developments relating to Indigenous peoples in Canada","A2: Developing Transferable Skills: apply, in a variety of contexts, skills developed through investigations related to contemporary First Nations, Métis, and Inuit realities and perspectives, and identify some careers in which the knowledge and skills acquired in this course might be an asset","B1: Colonial Naming and Cultural Identity: demonstrate an understanding of the connections between colonial naming and cultural identity in relation to First Nations, Métis, and Inuit communities","B2: Cultural Revitalization and Cultural Continuity: demonstrate an understanding of key issues, developments, and challenges relating to First Nations, Métis, and Inuit cultural revitalization and cultural continuity","B3: Cultural Understanding and Cultural Leadership: explain how Indigenous individuals, communities, and nations in Canada self-identify and are identified by others, analysing the influences and/or consequences of racism, stereotyping, contemporary culture, and cultural leadership","C1: Community Governance, Planning, and Administration: demonstrate an understanding of various contemporary political, economic, and social issues and/or developments relating to First Nations, Métis, and Inuit community governance, planning, and administration, including issues related to land settlement","C2: Community Aspirations, Development, and Leadership: demonstrate an understanding of key issues associated with contemporary First Nations, Métis, and Inuit community aspirations, development, and leadership","D1: Indigenous Legal Rights and the Constitution: demonstrate an understanding of key constitutional and other legal issues relating to Indigenous communities, governments, and individuals in Canada, explaining their significance for First Nations, Métis, and Inuit relations with federal, provincial, and territorial governments","D2: Policies and Policy Making: demonstrate an understanding of key policies and policy-making processes that affect First Nations, Métis, and Inuit relations with federal, provincial, and territorial governments and with non-Indigenous individuals and communities across Canada","D3: National and Regional Leadership: analyse various strategies and initiatives being implemented by leaders and policy-making groups to address political, social, and environmental issues affecting First Nations, Métis, and Inuit communities across Canada","E1: Global Trends and Indigenous Peoples: demonstrate an understanding of current global environmental, cultural, and social justice trends related to Indigenous peoples, comparing socio-political responses to these trends in Canada with responses in other countries around the world","E2: Social Action and Leadership: demonstrate an understanding of factors that influence social action related to Indigenous peoples, analysing various strategies and initiatives to raise awareness of Indigenous realities and comparing the Canadian context with other national contexts"]},"NDG4M":{"t":"First Nations, Métis, and Inuit Governance in Canada, Grade 12, University/College Preparation","o":["A1: The Inquiry Process in Legal Studies: use the legal studies inquiry process and the concepts of legal thinking when investigating issues pertaining to First Nations, Métis, and Inuit governance and Indigenous law in Canada","A2: Developing Transferable Skills: apply in everyday contexts skills developed through the study of First Nations, Métis, and Inuit governance and Indigenous law, and identify various careers in which a background in these areas might be an asset","B1: Treaties and Land Claim Agreements: demonstrate an understanding of the intent and scope of, and processes associated with, historical treaties and land claim agreements between Indigenous peoples and colonial, federal, and/or provincial/territorial governments in Canada prior to 1982","B2: Legislation: describe historical legislation at the colonial and federal levels that has affected First Nations, Métis, and Inuit individuals and communities in Canada, and assess its impact","B3: Political Relations: analyse relationships between Indigenous peoples and colonial, federal, and/or provincial/territorial governments in Canada prior to 1980","C1: First Nations, Métis, and Inuit Rights: demonstrate an understanding of First Nations, Métis, and Inuit rights in Canada and of various factors that affect them","C2: Constitutional/Charter Rights: demonstrate an understanding of the impact that the Constitution Act, 1982 and the Canadian Charter of Rights and Freedoms have had on First Nations, Métis, and Inuit rights in Canada","C3: Law and Policy: analyse how various laws, policies, and agreements since the 1980s have affected First Nations, Métis, and Inuit individuals and communities in Canada","C4: Changing Political Relations: analyse aspects of the relationship between Indigenous peoples and federal and provincial/territorial governments since the 1980s, including factors that have affected these relationships","D1: Land and Self-Determination: analyse the relationship of Indigenous peoples to the land and how land-based issues are related to Indigenous rights, self-determination, sovereignty, and self-governance","D2: Principles of Sovereignty and Self-Governance: demonstrate an understanding of key principles of and teachings and protocols related to Indigenous sovereignty and self-governance, including an understanding of the diversity of such teachings/protocols","D3: Responsibilities and Self-Determination: identify responsibilities associated with the goals of self-determination, sovereignty, self-governance, and reconciliation, and analyse strategies and practices that First Nations, Métis, and Inuit individuals and communities have used and are using to pursue these goals","D4: The International Context: demonstrate an understanding of the commonality of issues affecting Indigenous peoples both in Canada and around the world, with particular reference to self-determination, sovereignty, self-governance, human rights, and traditional Indigenous knowledge"]},"NDW4M":{"t":"Contemporary Indigenous Issues and Perspectives in a Global Context, Grade 12, University/College Preparation","o":["A1: Political Inquiry: use the political inquiry process and the concepts of political thinking when investigating contemporary issues, events, and developments relating to contemporary Indigenous peoples around the world","A2: Developing Transferable Skills: apply, in a variety of contexts, skills developed through investigations related to contemporary Indigenous realities and perspectives in a global context, and identify careers in which the knowledge and skills acquired in this course might be an asset","B1: Diversity and Identity: demonstrate an understanding of the global diversity of Indigenous peoples and cultures, and of how Indigenous identity and diversity may be defined, affirmed, or denied, distinguishing between the sociocultural practices and world views of a variety of Indigenous peoples","B2: Connections to the Land: demonstrate an understanding of the significance of the land to Indigenous peoples around the world, analysing the consequences of displacement from traditional territories and the benefits of Indigenous perspectives on resource management","B3: Indigenous Knowledge and Oral Traditions: demonstrate an understanding of the role of Indigenous knowledge, storytelling, and storywork in fulfilling communal responsibilities, sustaining world views, and protecting cultural heritage","C1: Economic, Social, and Technological Trends: demonstrate an understanding of key global economic, social, and technological trends, issues, and developments related to the cultural survival of Indigenous peoples","C2: Human Rights, Social Justice, and Cultural Survival: demonstrate an understanding of various legal and social factors affecting the human rights of Indigenous peoples, including the role and rights of Indigenous women and children and the relationship between living conditions and human rights","C3: Political Trends and Power Relations: demonstrate an understanding of the connections between political power and cultural survival, analysing the balance of power in a variety of interactions between Indigenous and non-Indigenous groups","C4: The Concept of Self-Determination: demonstrate an understanding of the concept of self-determination, exploring a variety of perspectives on and arguments for Indigenous sovereignty/self-governance","D1: International and Regional Law: demonstrate an understanding of the role of international and regional law, and of associated bodies and legal instruments, in upholding or obstructing the rights of Indigenous peoples around the world","D2: National Legislative and Judicial Action: demonstrate an understanding of the responsibility of national governments and judiciaries to uphold Indigenous rights, analysing a range of legislative and judicial actions to define and support those rights","D3: Education and Capacity Building: demonstrate an understanding of the significance of educational capacity, including capacity for language education, in protecting, preserving, and revitalizing Indigenous cultures","D4: Social Action and Global Leadership: demonstrate an understanding of key factors that influence social action, and analyse various initiatives to support Indigenous aspirations and perspectives globally in terms of the leadership strategies they employ"]},"FEF1D":{"t":"Extended French, Grade 9, Academic","o":["A1: Listening to Understand: determine meaning in a variety of authentic and adapted oral French texts, using a range of listening strategies","A2: Listening to Interact: interpret messages accurately while interacting in French for a variety of purposes and with diverse audiences","A
