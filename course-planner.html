    <style>
        /* Print-specific tweaks */
        /* System print: Ledger/Tabloid landscape. Only the print copy (#print-root) is printed. */
        #print-root { display: none; }
        @page { size: 17in 11in; margin: 0.4in; }
        @media print {
            html, body { padding: 0 !important; margin: 0 !important; background: white !important; }
            body > *:not(#print-root):not(#print-stage) { display: none !important; }
            #print-stage { display: block !important; position: absolute !important; left: -100000px !important; }
            #print-root { display: block !important; }
            #print-root * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #print-root thead { display: table-header-group; }   /* header repeats on every page */
            #print-root tbody tr { break-inside: avoid; page-break-inside: avoid; }
        }
        
        /* Custom scrollbar for wide tables */
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Input styling overrides */
        input[type="text"] { outline: none; transition: border-color 0.2s; }
        
        /* Fixed Vertical Text Styling (PDF Engine Safe) */
        /* Explicit heights so the text length is predictable and never overflows the cell */
        .vertical-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
        }
        .col-ach .vertical-wrapper { height: 392px; } /* leaves room for the K/U, T, C, A label */
        
        .vertical-text {
            position: absolute;
            left: 50%;
            /* Anchor exactly 8px from bottom to create a uniform baseline for all columns */
            top: calc(100% - 8px); 
            /* Pivot around top-left corner so varying text thickness doesn't alter baseline height */
            transform-origin: 0 0; 
            /* Rotate up, then shift left by 50% of its own thickness to center it horizontally */
            transform: rotate(-90deg) translateY(-50%);
            width: 400px; /* Overwritten by fitHeaders() to match the wrapper height */
            font-variant-ligatures: none; /* Prevents character mangling in PDF */
            text-align: left;
            line-height: 1.25;
            white-space: normal; /* OVERRIDES table's nowrap to allow multiple vertical lines */
        }

        /* Better contenteditable focus styles */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease;
        }
        [contenteditable="true"]:focus {
            background-color: white;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }
        
        /* Specific fix to prevent the vertical text from jumping */
        .vertical-text:focus {
            position: absolute !important;
            z-index: 50;
        }
    </style>

<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8 font-sans">
    <div id="print-root"></div>

    <div class="max-w-[1600px] mx-auto">
        <!-- Header & Controls -->
        <div class="flex flex-col xl:flex-row justify-between items-start xl:items-end mb-6 gap-6 bg-white p-6 rounded-lg shadow-sm border border-slate-200 no-print">
            
            <!-- Course Info -->
            <div class="w-full xl:w-auto">
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Course Planner</h1>
                <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 mt-4">
                    <label class="flex items-center gap-2 text-sm font-semibold text-slate-600">
                        Course Code: 
                        <input type="text" spellcheck="false" autocomplete="off" id="course-code" list="course-list" class="border-b-2 border-slate-300 bg-transparent py-1 px-2 text-slate-800 font-bold uppercase focus:border-blue-500 transition-colors w-32 placeholder-slate-400" placeholder="e.g. ENG4U" title="Type or pick a course code, then press Enter to load its Overall Expectations">
                        <datalist id="course-list"></datalist>
                        <button type="button" onclick="lookupCourse(true)" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded text-xs font-semibold" title="Load the Overall Expectations for this course">Load OEs</button>
                    </label>
                    <label class="flex items-center gap-2 text-sm font-semibold text-slate-600">
                        Teacher Name: 
                        <input type="text" spellcheck="false" id="teacher-name" class="border-b-2 border-slate-300 bg-transparent py-1 px-2 text-slate-800 font-bold focus:border-blue-500 transition-colors w-48 placeholder-slate-400" placeholder="e.g. Ms. Smith">
                    </label>
                </div>
                <div id="course-title" class="mt-2 text-sm text-slate-500 min-h-[1.25rem]"></div>
            </div>
            
            <!-- Actions -->
            <div class="flex flex-wrap gap-2 w-full xl:w-auto xl:justify-end">
                <button onclick="saveData()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded shadow-sm text-sm font-medium transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Save File
                </button>

                
                <label class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded shadow-sm text-sm font-medium transition-colors flex items-center gap-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Open File
                    <input type="file" id="fileInput" class="hidden" accept=".json" onchange="loadData(event)">
                </label>

                <div class="w-px h-8 bg-slate-300 mx-2 hidden sm:block"></div>

                <button onclick="printPlanner()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded shadow-sm text-sm font-medium transition-colors flex items-center gap-2" title="Open the system print dialog (11 x 17 landscape). Choose 'Save as PDF' for a sharp, text-searchable PDF.">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print
                </button>
            </div>
        </div>

        <!-- Main Content for PDF Generation -->

ate accounting skills related to the accounting cycle for a service business","A2: Inventory Systems: demonstrate an understanding of inventory systems","A3: The Accounting Cycle for a Merchandising Business: demonstrate accounting skills related to the accounting cycle for a merchandising business","B1: Special Journals: demonstrate an understanding of special journals","B2: Accounting for Receivables: apply accounting procedures for accounts receivable","B3: Accounting for Payables: apply accounting procedures for accounts payable","C1: Fixed Assets: describe and apply accounting procedures for fixed assets","C2: Payroll Practices: demonstrate an understanding of payroll practices","C3: Income Tax: demonstrate an understanding of income tax procedures","D1: Ethics and Issues in Accounting: identify and describe ethical challenges for, and the impact of current issues in, accounting","D2: Budgeting: explain the budgeting process","D3: Business Expansion: describe issues facing a growing business"]},"BAT4M":{"t":"Financial Accounting Principles, Grade 12, University/College Preparation","o":["A1: Accounting Principles and Practices: demonstrate an understanding of accounting principles and practices","A2: Accounting Cycle in a Computerized Environment: demonstrate an understanding of the accounting cycle in a computerized environment for a service business and a merchandising business","A3: Ethics and Issues in Accounting: demonstrate an understanding of ethics and issues in accounting","B1: Short-Term Assets: demonstrate an understanding of accounting procedures for short-term assets","B2: Inventory Procedures: analyse accounting procedures for inventories","B3: Capital Assets: demonstrate an understanding of methods of accounting for capital assets","C1: Partnerships: demonstrate an understanding of accounting in partnerships","C2: Corporations: demonstrate an understanding of accounting in corporations","D1: Methods of Financing: compare methods of financing","D2 ppropriate software to facilitate the completion of a team project that involves a multimedia product","C1: Electronic Research and Communication: use a variety of electronic resources to retrieve, evaluate, and communicate information","C2: The Team Process: demonstrate an understanding of the team process in the work environment","C3: Organization and Time Management: use software and electronic tools to implement organizational and time-management strategies","D1: Digital Portfolio: demonstrate an understanding of the importance of keeping an updated digital portfolio that accurately reflects their information and communication technology competencies and skills for job interview purposes","D2: The Job Search: demonstrate an understanding of strategies for conducting an effective job search","D3: School-to-Career Transition: develop strategies to make an effective transition from school to career"]},"BEM1O":{"t":"Building the Entrepreneurial Mindset, Grade 9, Open","o":["A1: Business Leadership and Project Management: demonstrate an understanding of various business leadership styles and use a project management process when performing business-related tasks","A2: Business Technologies: demonstrate an understanding of business-related digital technologies and use them in a way that respects their own and others' online safety and data security to complete a variety of business-related tasks and projects","A3: Connections, Applications, and Careers: analyze how business skills and knowledge can be applied in other subject areas and in a variety of careers","A4: Contributions of Entrepreneurs: describe how entrepreneurs contribute to social, economic, and environmental progress, and analyze challenges that they face, identifying ways to address these challenges","B1: The Entrepreneurial Mindset: demonstrate an understanding of the mindset necessary to succeed as an entrepreneur, and describe how the experiences of various entrepreneurs led them to innovate and start new businesses","B2: Designing an Entrepreneurial Idea: use a design process to identify how to meet various market needs and opportunities, and select and develop an entrepreneurial idea to pursue","B3: Refining an Entrepreneurial Idea: use a problem solving process to assess and refine their entrepreneurial idea, considering its social, economic, environmental, and ethical impacts","B4: Pitching an Entrepreneurial Idea: use a pitch process to effectively communicate their entrepreneurial idea to various audiences for the purpose of gathering support for a potential entrepreneurial venture","C1: Developing and Organizing Ideas: generate and develop ideas for a variety of business texts, including digital and media texts, and research, synthesize, and organize the ideas and information","C2: Creating Business Texts: create a variety of draft business texts, including digital and media texts, using clear language as well as appropriate business terminology, text forms, design elements, and digital tools and techniques","C3: Publishing and Presenting: publish and present final business texts in an accessible format, including digital and media texts, using appropriate digital and oral presentation tools and techniques"]},"BEP2O":{"t":"Launching and Leading a Business, Grade 10, Open","o":["A1: Business Leadership and Project Management: demonstrate an understanding of various business leadership styles and use a project management process when performing business-related tasks","A2: Business Technologies: demonstrate an understanding of business-related digital technologies and use them in a way that respects their own and others' online safety and data security to complete a variety of business-related tasks and projects","A3: Connections, Applications, and Careers: analyze how business skills and knowledge can be applied in other subject areas and in a variety of careers","A4: Contributions of Entrepreneurs: describe how entrepreneurs contribute to social, economic, and environmental progress, and analyze challenges that they face, identifying ways to address these challenges","B1: Market Forces: demonstrate an understanding of how businesses respond to market forces, including supply and demand, and the needs and wants of consumers","B2: The Competitive Market Environment in Canada: demonstrate an understanding of the competitive market environment in Canada and the ways in which economic systems, trade relationships, and governments influence it","B3: Business in Canada: demonstrate an understanding of the various types of businesses that compose Canada's economy, and analyze the effect of their activity and innovation on communities and domestic and global economies","C1: The Entrepreneurial Mindset: Designing, Refining, and Pitching an Idea: develop, refine, and pitch an entrepreneurial idea by using design, problem solving, and pitch processes as well as an entrepreneurial mindset","C2: Planning an Entrepreneurial Venture: identify and plan the various components necessary for their entrepreneurial venture's development, and evaluate the feasibility of their venture throughout the planning process","C3: Financing and Launching an Entrepreneurial Venture: launch an entrepreneurial venture by identifying funding opportunities and sales strategies that will help them to achieve their goals and key performance indicators","D1: Operations: demonstrate an understanding of the processes involved in producing a product or delivering a service, and develop a process for producing their product or delivering their service, identifying ways to improve the process overall","D2: Marketing: demonstrate an understanding of the \"three Cs\" (company, customer, and competition) and the \"four Ps\" (product, price, place, and promotion), including how different strategies can be used in different markets","D3: Accounting: demonstrate an understanding of the role and importance of accounting to the entrepreneurial process and to the development and growth of a small business","D4: Management of Human Resources: demonstrate an understanding of the role of management in supporting a team of employees, including a manager's ethical, moral, and legal responsibilities and considerations"]},"CGD3M":{"t":"Regional Geography, Grade 11, University/College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating geographic issues in a selected region","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Regional Characteristics: demonstrate an understanding of key cultural and socio-economic characteristics of the selected region and of individual countries in it (FOCUS ON: Patterns and Trends; Geographic Perspective)","B2: Patterns of Natural and Human Systems: describe patterns in natural features and population distribution in the selected region, and analyse the relationship between them (FOCUS ON: Spatial Significance; Interrelationships)","B3: Quality of Life: assess quality of life in the selected region, including factors that contribute to quality of life and policies/programs that aim to improve it (FOCUS ON: Interrelationships; Geographic Perspective)","C1: Sustainability and Stewardship of Natural Resources: analyse issues associated with sustainability and stewardship of natural resources in the selected region (FOCUS ON: Spatial Significance; Geographic Perspective)","C2: Inequality and Sustainability: analyse aspects of inequality and economic sustainability in the selected region, including programs intended to promote equality and sustainability (FOCUS ON: Patterns and Trends; Interrelationships)","C3: Development Projects/Megaprojects: analyse various issues associated with development projects, including, where applicable, megaprojects, in the selected region (FOCUS ON: Interrelationships; Geographic Perspective)","D1: International Organizations in the Region: analyse the role and involvement of intergovernmental organizations in the selected region (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Conflict and Cooperation: analyse aspects of economic, social, and political conflict and cooperation in the selected region (FOCUS ON: Interrelationships; Geographic Perspective)","D3: Economic Development: analyse economic activity in the selected region as well as factors that contribute to the region's economic development (FOCUS ON: Spatial Significance; Interrelationships)","E1: Globalization: analyse how globalization has affected the selected region and how the region has responded to it (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Shifting Populations: analyse current as well as historical patterns of population movement and distribution in the selected region (FOCUS ON: Spatial Significance; Patterns and Trends)","E3: Climate Change and Natural Hazards: explain how climate, including climate change, and natural hazards affect the selected region (FOCUS ON: Patterns and Trends; Interrelationships)"]},"CGF3M":{"t":"Forces of Nature - Physical Processes and Disasters, Grade 11, University/College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating physical systems, natural phenomena, and natural events","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Physical Processes and Natural Hazards: analyse the characteristics of different types of natural hazards, and explain the role of physical processes in their occurrence (FOCUS ON: Spatial Significance; Interrelationships)","B2: Spatial Connections: analyse relationships between physical processes and the earth's physical characteristics (FOCUS ON: Patterns and Trends; Interrelationships)","B3: Physical Characteristics of the Earth: describe the spatial distribution of the earth's physical features and the processes that form them (FOCUS ON: Spatial Significance; Interrelationships)","C1: Renewing the Physical Environment: analyse the role of physical processes and human practices in maintaining a sustainable natural environment (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Human Impact on the Physical Environment: analyse the impacts of human activities on the earth's physical processes and the natural environment (FOCUS ON: Spatial Significance; Interrelationships)","C3: Human Use of the Physical Environment: analyse the influence of physical processes and features on human activity (FOCUS ON: Spatial Significance; Geographic Perspective)","D1: Sharing the Physical Environment: analyse issues relating to natural and human impacts on the environment and the sharing of natural resources between population groups (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Population and Disasters: analyse the influence of human settlement choices and the earth's physical processes on the impacts of disasters (FOCUS ON: Patterns and Trends; Interrelationships)","D3: Earth's Planetary Characteristics and Life: explain the significance of Earth's planetary characteristics and history for the development and maintenance of life on Earth (FOCUS ON: Spatial Significance; Interrelationships)","E1: Impacts of Processes and Disasters: analyse impacts of physical processes and disasters on human and natural systems, locally, nationally, and globally (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Disaster Preparedness: assess the role and effectiveness of various options for reducing the impacts of disasters on human populations (FOCUS ON: Spatial Significance; Geographic Perspective)","E3: Processes of Change: describe how the earth's natural systems change, and have changed, over various time scales, and explain some of the processes that cause these changes (FOCUS ON: Spatial Significance; Patterns and Trends)"]},"CGG3O":{"t":"Travel and Tourism - A Geographic Perspective, Grade 11, Open","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating geographic issues relating to travel and tourism","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Spatial Interaction: analyse patterns of spatial interaction between tourist sources and destinations (FOCUS ON: Spatial Significance; Patterns and Trends)","B2: Spatial Distribution: explain interrelationships between tourism and the spatial distribution of services and attractions in tourist destinations (FOCUS ON: Patterns and Trends; Interrelationships)","B3: Choice of Destination: analyse a range of factors that influence tourists' destination choices (FOCUS ON: Spatial Significance; Geographic Perspective)","C1: Impacts of Travel and Tourism: assess impacts of tourism and different modes of travel from a geographic perspective (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Sustainable Tourism and Stewardship: analyse strategies for the protection of natural and cultural resources that are essential to tourism, and assess their effectiveness (FOCUS ON: Interrelationships; Geographic Perspective)","C3: Stewardship and the Sustainability of Societies: assess social and cultural impacts of tourism on tourist destinations, and explain the role of good stewardship practices in supporting the social and cultural sustainability of destination communities (FOCUS ON: Spatial Significance; Geographic Perspective)","D1: Local Tourism: analyse interrelationships between tourism and local human and natural systems (FOCUS ON: Spatial Significance; Interrelationships)","D2: Tourism Patterns and Influencing Trends: assess the impacts of social, economic, and political trends and events on travel and tourism (FOCUS ON: Patterns and Trends; Geographic Perspective)","D3: New Directions: identify evolving trends in travel and tourism, and analyse their implications for future tourism development (FOCUS ON: Patterns and Trends; Interrelationships)","E1: Environmental Challenges: analyse impacts of environmental conditions and concerns on the tourism industry (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Impacts on Local Populations and Indigenous Peoples: assess impacts of the travel and tourism industry on local populations and indigenous peoples (FOCUS ON: Interrelationships; Geographic Perspective)","E3: Planning for Tourism: analyse the role of the tourism industry, governments, and international organizations in planning, promoting, and supporting travel and tourism (FOCUS ON: Spatial Significance; Patterns and Trends)"]},"CGO4M":{"t":"Spatial Technologies in Action, Grade 12, University/College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when conducting investigations using spatial technologies","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Applying Spatial Technology Skills: demonstrate the ability to use a variety of spatial technologies to collect and analyse data, communicate the results of their investigations, and make decisions based on their analyses (FOCUS ON: Spatial Significance; Geographic Perspective)","B2: Interpreting Spatial Data: interpret and analyse data produced by a variety of spatial technologies (FOCUS ON: Spatial Significance; Patterns and Trends)","B3: Fundamentals of Spatial Organization: describe and apply the fundamental components of spatial organization used in a variety of spatial technologies (FOCUS ON: Interrelationships; Geographic Perspective)","C1: Supporting Sustainable Environments: apply spatial technologies to assess and support the sustainable use of natural and human environments (FOCUS ON: Spatial Significance; Geographic Perspective)","C2: Identifying Environmental Patterns and Trends: apply, and explain the role of, spatial technologies in analysing environmental patterns and trends and making decisions related to sustainability (FOCUS ON: Patterns and Trends; Interrelationships)","D1: Relationships between Systems: investigate and analyse relationships and interactions within and between physical and human systems, using a variety of spatial technologies (FOCUS ON: Spatial Significance; Interrelationships)","D2: International and Social Implications: investigate and evaluate the role of spatial technologies in national and global security and safety, global communications, and international cooperation (FOCUS ON: Interrelationships; Geographic Perspective)","D3: Global System Interactions: apply, and explain the use of, spatial technologies to analyse interactions between people, places, and issues at a global level (FOCUS ON: Patterns and Trends; Interrelationships)","E1: Monitoring and Predicting Change: apply, and assess the use of, spatial technologies to monitor, model, and predict change in human and physical environments at the local, national, and global levels (FOCUS ON: Spatial Significance; Patterns and Trends)","E2: Development of Spatial Technologies: describe developments in spatial technologies over time and potential developments in the future, and analyse how these developments affect the uses and users of these technologies (FOCUS ON: Interrelationships; Geographic Perspective)"]},"CGR4E":{"t":"Living in a Sustainable World, Grade 12, Workplace Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating issues relating to the natural environment and sustainability","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Endangered Species and Spaces: identify species and natural places at risk in different parts of the world, and compare approaches that various countries have taken for their protection (FOCUS ON: Spatial Significance; Interrelationships)","B2: Human Impacts on Ecosystems: explain how human settlement and activities alter ecosystems (FOCUS ON: Patterns and Trends; Geographic Perspective)","B3: Ecosystem Characteristics: describe the characteristics of different types of ecosystems, and explain their relationships with the natural processes in the Earth system (FOCUS ON: Spatial Significance; Interrelationships)","C1: Strategies and Stewardship Initiatives: assess the contributions of stewardship initiatives by groups and individuals to the sustainable use and management of natural resources, locally, nationally, and globally (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Resource Development and Impacts: analyse impacts and issues related to the development and use of natural resources (FOCUS ON: Interrelationships; Geographic Perspective)","C3: Distribution and Use of Natural Resources: analyse patterns and trends in the availability and use of natural resources (FOCUS ON: Spatial Significance; Patterns and Trends)","D1: Protecting the Natural Environment: assess the role of various strategies, organizations, and agreements in reducing the impact of human activity on the environment (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Impacts of Human Activities: analyse impacts of human activities on ecological processes and on plant and animal species (FOCUS ON: Spatial Significance; Interrelationships)","D3: Ecological Processes: explain how various ecological and biological processes sustain life on Earth (FOCUS ON: Patterns and Trends; Interrelationships)","E1: Working Together: assess the contribution of various individual, workplace, and community initiatives to reducing the human impact on the natural environment (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Ecological Footprints: assess impacts of human behaviour on the natural environment (FOCUS ON: Patterns and Trends; Interrelationships)","E3: Community Infrastructure: assess environmental impacts of various types of infrastructure, systems, and services at the community and regional levels, and assess ways of reducing these impacts (FOCUS ON: Spatial Significance; Interrelationships)"]},"CGR4M":{"t":"The Environment and Resource Management, Grade 12, University/College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating issues related to the environment and the management of natural resources","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify careers in which a background in geography might be an asset","B1: Protecting Species and Spaces: assess various strategies used for protecting natural spaces and species, locally, nationally, and globally (FOCUS ON: Spatial Significance; Interrelationships)","B2: Human Impacts: assess impacts of human population settlement on natural spaces and species (FOCUS ON: Interrelationships; Geographic Perspective)","B3: The Earth's Ecosystems: analyse relationships between the spheres of the earth and the characteristics of ecosystems (FOCUS ON: Spatial Significance; Interrelationships)","C1: Policies and Strategies: analyse the roles and contributions of individuals, governments, and organizations with respect to the sustainable management of the world's natural resources (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Development of Natural Resources: analyse impacts of resource development on the natural and human environment, and assess ways of managing resource development sustainably (FOCUS ON: Interrelationships; Geographic Perspective)","C3: Availability and Use of Natural Resources: assess the availability of various natural resources, and analyse factors affecting their exploitation and use (FOCUS ON: Spatial Significance; Patterns and Trends)","D1: Reducing Pollution: analyse challenges involved in reducing pollution from human activities, and assess the effectiveness of various methods of pollution reduction (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Impacts of Pollution: evaluate impacts of various types of pollution on the natural environment and on human health (FOCUS ON: Patterns and Trends; Interrelationships)","D3: Ecological Processes: describe key ecological and biological processes, and explain how they are affected by human activities (FOCUS ON: Spatial Significance; Interrelationships)","E1: Developing Solutions: assess a variety of strategies for resolving environmental and natural resource management issues, locally, nationally, and/or globally (FOCUS ON: Interrelationships; Geographic Perspective)","E2: Community Land Use and Infrastructure: assess impacts of community land use and infrastructure on humans and the natural environment, and assess ways of reducing these impacts (FOCUS ON: Spatial Significance; Interrelationships)","E3: Ecological Footprints: analyse impacts of various human behaviours on the natural environment, and assess the role of behaviour, ethics, and technology in reducing these impacts (FOCUS ON: Patterns and Trends; Geographic Perspective)"]},"CGT3O":{"t":"Introduction to Spatial Technologies, Grade 11, Open","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when conducting investigations using spatial technologies","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Applying Skills in a Local Context: use a variety of spatial technologies to collect and analyse information and field data for the purpose of assessing local geography and geographic issues (FOCUS ON: Spatial Significance; Geographic Perspective)","B2: Fundamentals of Field Data Collection: demonstrate an understanding of the fundamental concepts and processes associated with the collection and analysis of field data using a variety of spatial technologies (FOCUS ON: Spatial Significance; Patterns and Trends)","B3: Fundamentals of Cartography: describe and use basic mapping conventions, various types of maps, and fundamental concepts of cartography, and apply that knowledge to analyse bias in the construction and use of maps (FOCUS ON: Interrelationships; Geographic Perspective)","C1: Creating and Supporting Sustainable Spaces: use a variety of spatial technologies to help them assess human activities and plan and promote the sustainable use of the natural environment, including natural resources, in their local community or area (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Analysing Environmental Issues: use a variety of spatial technologies to analyse the impact of human activity on the environment in their local community or area and beyond, and identify possible solutions (FOCUS ON: Spatial Significance; Patterns and Trends)","D1: Spatial Technologies and Society: describe and assess the ways in which different groups in society use spatial technologies for planning and decision making (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Connecting Global and Local Issues: use a variety of spatial technologies to analyse global issues related to geography and their impacts on the local community or area (FOCUS ON: Patterns and Trends; Interrelationships)","E1: Monitoring Local Change: investigate the use of spatial technologies to monitor trends and predict change at the local level (FOCUS ON: Patterns and Trends; Geographic Perspective)","E2: Development of Spatial Technologies: describe developments in spatial technologies over time, including Canadian contributions to the field, and explain some of the effects of these developments on job opportunities and on aspects of the broader society (FOCUS ON: Patterns and Trends; Interrelationships)"]},"CGU4M":{"t":"World Geography - Urban Patterns and Population Issues, Grade 12, University/College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating issues affecting ecumenes","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Increasing Liveability: assess the liveability of ecumenes in Canada and other parts of the world, and analyse factors that influence liveability (FOCUS ON: Spatial Significance; Patterns and Trends)","B2: Processes that Shape Ecumenes: describe interrelationships between the environmental, social, economic, and political processes that shape ecumenes (FOCUS ON: Spatial Significance; Interrelationships)","B3: Understanding Ecumenes: describe the spatial distribution of land use in human settlements according to selected theories (FOCUS ON: Patterns and Trends; Interrelationships)","C1: Working towards Sustainability: analyse impacts of human activity and human settlements on the environment, and assess the effectiveness of solutions to these impacts in selected ecumenes (FOCUS ON: Spatial Significance; Geographic Perspective)","C2: Stewardship: assess ways in which stewardship practices can contribute to the sustainability of human settlements (FOCUS ON: Interrelationships; Geographic Perspective)","C3: Modifying the Environment: describe ways in which human societies modify their local environments in order to meet economic, social, political, and other needs, and assess the effects of these modifications on sustainability (FOCUS ON: Spatial Significance; Geographic Perspective)","D1: Policies and Change: analyse impacts of public opinion and policy on interactions within and between ecumenes (FOCUS ON: Patterns and Trends; Interrelationships)","D2: Population Change and Migration: analyse impacts of population change and migration on the social characteristics and built environment of cities (FOCUS ON: Patterns and Trends; Interrelationships)","D3: Challenges of Interdependence: analyse the effects of international assistance and formal and informal international economic activity on quality of life in developed and developing countries (FOCUS ON: Interrelationships; Geographic Perspective)","E1: Quality of Urban Life: analyse interrelationships between urban environments and quality of life (FOCUS ON: Spatial Significance; Interrelationships)","E2: Analysis of Solutions: assess from a geographic perspective the effectiveness of solutions to issues affecting the built environment (FOCUS ON: Interrelationships; Geographic Perspective)"]},"CGW4C":{"t":"World Issues - A Geographic Analysis, Grade 12, College Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating world issues","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify some careers in which a background in geography might be an asset","B1: Economic Disparities: analyse interrelationships between social conditions, access to natural resources, government policies, and economic disparities within and between countries or regions (FOCUS ON: Interrelationships; Geographic Perspective)","B2: Resources and Human Systems: analyse global patterns of natural resource and population distribution and their interrelationship with human networks and systems (FOCUS ON: Patterns and Trends; Interrelationships)","B3: Characteristics of World Regions: classify and compare countries and regions of the world, using appropriate criteria and statistical measures (FOCUS ON: Spatial Significance; Patterns and Trends)","C1: Environmental Stewardship: analyse the role of individuals, the local community, and governments in achieving sustainability, and assess opportunities for personal stewardship and involvement in sustainability initiatives (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Resource Use and Sustainability: analyse selected resource uses and sustainability practices in a variety of countries (FOCUS ON: Interrelationships; Geographic Perspective)","C3: Managing the Global Commons: explain the meaning and significance of the global commons, and analyse issues associated with the use and sustainability of its various elements (FOCUS ON: Spatial Significance; Patterns and Trends)","D1: Managing Globalization: assess responsibilities for managing the impacts of globalization, and describe ways in which these impacts can be moderated (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Multinational Corporations: analyse issues related to the operations of multinational corporations in the global economy (FOCUS ON: Spatial Significance; Geographic Perspective)","D3: Globalization – Characteristics and Impacts: analyse the principal characteristics and major impacts of globalization (FOCUS ON: Interrelationships; Geographic Perspective)","E1: Urbanization: analyse trends in urbanization in both economically developed and developing regions of the world, and assess the impacts of these trends (FOCUS ON: Spatial Significance; Patterns and Trends)","E2: Population Growth and Demographic Change: analyse global and regional population trends, and assess their impacts on society, the economy, and the ability of societies to meet basic human needs (FOCUS ON: Patterns and Trends; Geographic Perspective)","E3: Human Rights and Quality of Life: analyse impacts of a variety of factors on human rights and quality of life in selected countries (FOCUS ON: Interrelationships; Geographic Perspective)"]},"CGW4U":{"t":"World Issues - A Geographic Analysis, Grade 12, University Preparation","o":["A1: Geographic Inquiry: use the geographic inquiry process and the concepts of geographic thinking when investigating world issues","A2: Developing Transferable Skills: apply in everyday contexts skills, including spatial skills, developed through geographical investigation, and identify careers in which a background in geography might be an asset","B1: Natural Resource Disparities: analyse relationships between quality of life and access to natural resources in various countries and regions (FOCUS ON: Spatial Significance; Interrelationships)","B2: Population Disparities: analyse relationships between demographic and political factors and quality of life in various countries and regions (FOCUS ON: Interrelationships; Geographic Perspective)","B3: Classifying Regions of the World: explain how various characteristics are used to classify the world into regions or other groupings (FOCUS ON: Spatial Significance; Patterns and Trends)","C1: Strategies and Initiatives: analyse strategies and initiatives that support environmental stewardship at a national and global level, and assess their effectiveness in promoting the sustainability of the natural environment (FOCUS ON: Interrelationships; Geographic Perspective)","C2: Population Growth: assess the impact of population growth on the sustainability of natural systems (FOCUS ON: Spatial Significance; Patterns and Trends)","C3: Caring for the Commons: analyse issues relating to the use and management of common-pool resources (FOCUS ON: Interrelationships; Geographic Perspective)","D1: Trade and Immigration: analyse the influence of trade agreements and immigration policies on global interdependence and the well-being of countries (FOCUS ON: Interrelationships; Geographic Perspective)","D2: Impacts and Management: analyse issues relating to national and global impacts of globalization from a geographic perspective, and assess responsibilities and approaches for managing these issues (FOCUS ON: Spatial Significance; Geographic Perspective)","D3: Characteristics and Driving Forces: describe the major characteristics of globalization, and analyse factors that are driving the globalizing process (FOCUS ON: Patterns and Trends; Interrelationships)","E1: Leadership and Policy: analyse the influence of governments, groups, and individuals on the promotion and management of social change (FOCUS ON: Patterns and Trends; Geographic Perspective)","E2: Agents of Change: analyse impacts of selected agents of change on society and quality of life (FOCUS ON: Interrelationships; Geographic Perspective)","E3: Continuing Challenges: analyse issues relating to human rights, food security, health care, and other challenges to the quality of life of the world's population (FOCUS ON: Spatial Significance; Patterns and Trends)"]},"CHA3U":{"t":"American History, Grade 11, University Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of American history","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse the significance, for different groups in the United States, of various social, economic, and political practices and developments prior to 1791 (FOCUS ON: Continuity and Change; Historical Perspective)","B2: Communities, Conflict, and Cooperation: analyse relations between various groups, and between different groups and the environment, in the United States prior to 1791, and assess the impact of these interrelationships (FOCUS ON: Historical Significance; Cause and Consequence)","B3: Identity, Citizenship, and Heritage: analyse how some individuals and a variety of social and political forces prior to 1791 affected the development of identity, citizenship, and heritage in the United States (FOCUS ON: Continuity and Change; Historical Perspective)","C1: Social, Economic, and Political Context: describe various social, economic, and political events, trends, and developments that occurred in, or affected people in, the United States between 1791 and 1877, and assess their impact (FOCUS ON: Historical Significance; Continuity and Change)","C2: Communities, Conflict, and Cooperation: analyse developments affecting interrelationships between different groups in the United States, and between the United States and other countries, from 1791 to 1877 (FOCUS ON: Cause and Consequence; Historical Perspective)","C3: Identity, Citizenship, and Heritage: analyse the impact of various people, policies, and practices on the development of identity, citizenship, and heritage in the United States between 1791 and 1877 (FOCUS ON: Continuity and Change; Historical Perspective)","D1: Social, Economic, and Political Context: describe various social, economic, and political events, trends, and developments in the United States between 1877 and 1945, and analyse their key causes and consequences (FOCUS ON: Cause and Consequence; Historical Perspective)","D2: Communities, Conflict, and Cooperation: describe significant issues that led to conflict and cooperation in the United States between 1877 and 1945, and analyse the impact of these interactions (FOCUS ON: Historical Significance; Continuity and Change)","D3: Identity, Citizenship, and Heritage: analyse the impact of various policies, groups, and cultural and technological developments on identity, citizenship, and heritage in the United States between 1877 and 1945 (FOCUS ON: Cause and Consequence; Historical Perspective)","E1: Social, Economic, and Political Context: describe various social, economic, and political events, trends, and developments in the United States since 1945, and analyse their key causes and consequences (FOCUS ON: Cause and Consequence)","E2: Communities, Conflict, and Cooperation: analyse how various events and developments have affected specific groups in the United States, and relations between the United States and other countries, since 1945 (FOCUS ON: Historical Significance; Continuity and Change)","E3: Identity, Citizenship, and Heritage: analyse how various groups, trends, and cultural developments have affected identity, citizenship, and heritage in the United States since 1945 (FOCUS ON: Historical Significance; Historical Perspective)"]},"CHE3O":{"t":"Origins and Citizenship - The History of a Canadian Ethnic Group, Grade 11, Open","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating the history of the selected ethnic group","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse key social, economic, and political events, trends, and/or developments in the selected ethnic group's country or region of origin and how they changed over time (FOCUS ON: Historical Significance; Continuity and Change)","B2: Significant Interactions: analyse the impact of significant interactions, including interactions with the environment, on the selected ethnic group's country or region of origin (FOCUS ON: Historical Significance; Cause and Consequence)","B3: Culture and Identity: analyse ways in which various factors contributed to the development of culture and identity in the selected ethnic group in its country or region of origin (FOCUS ON: Continuity and Change; Historical Perspective)","C1: Social, Economic, and Political Factors: analyse ways in which various social, economic, and political factors influenced people's decisions to emigrate, with particular emphasis on the selected ethnic group (FOCUS ON: Historical Significance; Continuity and Change)","C2: Conflict and Repression: analyse the roles played by conflict and denial of rights in people's decisions to emigrate, with particular reference, where applicable, to the selected ethnic group (FOCUS ON: Cause and Consequence; Continuity and Change)","C3: Supports and Incentives: analyse the roles played by family, community organizations, and governments in people's decisions to emigrate, and in attracting them to Canada (FOCUS ON: Historical Perspective)","D1: Settling in Canada: explain how various social and economic factors influenced the settlement of some ethnic groups in Canada, with particular reference to the selected ethnic group, and analyse the impact of ethnic settlements in this country (FOCUS ON: Historical Significance; Continuity and Change)","D2: Facing Challenges in Canada: analyse various challenges that have faced new immigrants to Canada, as well as policies that have been developed to address some of those challenges (FOCUS ON: Cause and Consequence; Historical Perspective)","D3: Contributing to Canada: explain various ways in which ethnic groups, including the selected ethnic group, have contributed to Canada (FOCUS ON: Historical Significance; Continuity and Change)","E1: Social, Economic, and Political Issues: analyse ways in which some social, economic, and/or political issues, events, and/or developments at the local, national, and international level have affected the selected ethnic group in Canada (FOCUS ON: Historical Significance; Cause and Consequence)","E2: From Assimilation to Multiculturalism: analyse the evolution of social and political perspectives and political policies related to immigration and cultural diversity in Canada (FOCUS ON: Cause and Consequence; Historical Perspective)","E3: Cultural Traditions: analyse some of the challenges that ethnic groups face in trying to maintain their traditional cultures, and describe ways in which groups in Canada have maintained their cultures (FOCUS ON: Historical Significance; Continuity and Change)"]},"CHI4U":{"t":"Canada - History, Identity, and Culture, Grade 12, University Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of Canadian history, with a focus on the development of identity and culture","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Setting the Context: analyse the significance, for different groups in Canada, of various social/cultural, economic, and political practices and developments prior to 1774 (FOCUS ON: Historical Significance; Historical Perspective)","B2: Interactions and Interdependence: analyse activities of and interactions between various groups in Canada prior to 1774 and how these groups and their interactions contributed to the development of Canada, including the development of identity in Canada (FOCUS ON: Cause and Consequence; Continuity and Change)","B3: Diversity and Citizenship: assess the impact of various individuals, groups, and colonial policies prior to 1774 on the development of identity, citizenship, and heritage in Canada (FOCUS ON: Continuity and Change; Historical Perspective)","C1: Setting the Context: analyse various social/cultural, economic, and political events, trends, and/or developments that occurred in or affected Canada between 1774 and 1867, and assess their impact (FOCUS ON: Historical Significance; Continuity and Change)","C2: Interactions and Interdependence: analyse the impact on the development of Canada of various interactions between different groups in Canada, as well as between Canada, Great Britain, and the United States, from 1774 to 1867 (FOCUS ON: Cause and Consequence; Historical Perspective)","C3: Diversity and Citizenship: analyse how various individuals and groups contributed to the social and political development of Canada between 1774 and 1867 and to the evolution of identity and citizenship in Canada (FOCUS ON: Continuity and Change; Historical Perspective)","D1: Setting the Context: analyse how various social/cultural, economic, and political events, trends, and/or developments in Canada from 1867 to 1945 contributed to the development of the country (FOCUS ON: Continuity and Change; Historical Perspective)","D2: Interactions and Interdependence: analyse how various interactions at both the national and international level between 1867 and 1945 contributed to the development of Canada (FOCUS ON: Historical Significance; Cause and Consequence)","D3: Diversity and Citizenship: analyse challenges facing various groups in Canada between 1867 and 1945 as well as the contributions of various groups and individuals to the development of identity, culture, and citizenship in Canada (FOCUS ON: Continuity and Change; Historical Perspective)","E1: Setting the Context: analyse various social/cultural, economic, and political events, trends, and/or developments in Canada since 1945 and their impact on the development of the country (FOCUS ON: Cause and Consequence; Continuity and Change)","E2: Interactions and Interdependence: analyse how various interactions at both the national and international level since 1945 have contributed to the development of Canada, including the development of identity in Canada (FOCUS ON: Historical Significance; Continuity and Change)","E3: Diversity and Citizenship: analyse how various individuals and groups have contributed to the development of identity, culture, and citizenship in Canada since 1945 (FOCUS ON: Continuity and Change; Historical Perspective)"]},"CHM4E":{"t":"Adventures in World History, Grade 12, Workplace Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating various aspects of world history","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify some careers in which these skills might be useful","B1: Society and Community: explain how various social and environmental factors affected the lives of people in two or more societies in different regions of the world and at different times up to the fifteenth century (FOCUS ON: Historical Significance; Cause and Consequence)","B2: Politics and Conflict: demonstrate an understanding of political systems, political change, and conflict in some societies in different regions of the world and at different times up to the fifteenth century (FOCUS ON: Cause and Consequence; Continuity and Change)","B3: Work and Economies: explain how aspects of the economy, including types of work, affected two or more societies in different regions of the world and at different times up to the fifteenth century (FOCUS ON: Historical Significance; Historical Perspective)","B4: Culture and Heritage: explain the significance of various cultural developments, including the contributions of some individuals, for the heritage of two or more societies in different regions of the world and at different times up to the fifteenth century (FOCUS ON: Historical Significance; Continuity and Change)","C1: Society and Community: explain how various social issues, trends, and developments affected the lives of people in two or more societies in different regions of the world and at different times between the fifteenth and nineteenth centuries (FOCUS ON: Historical Significance; Historical Perspective)","C2: Politics and Conflict: analyse the impact of various political developments, including conflict within and between countries, on some societies in different regions of the world and at different times between the fifteenth and nineteenth centuries (FOCUS ON: Cause and Consequence; Continuity and Change)","C3: Work and Economies: explain how trade and the work roles of different people contributed to the development of two or more societies in different regions of the world and at different times between the fifteenth and nineteenth centuries (FOCUS ON: Historical Significance; Continuity and Change)","C4: Culture and Heritage: explain the impact of some significant individuals and of various aspects of culture on the development of identity and/or heritage in two or more societies in different regions of the world and at different times between the fifteenth and nineteenth centuries (FOCUS ON: Cause and Consequence; Historical Perspective)","D1: Society and Community: analyse key causes and consequences of various social trends, developments, and movements in two or more societies in different regions of the world and at different times since the nineteenth century (FOCUS ON: Historical Significance; Cause and Consequence)","D2: Politics and Conflict: analyse various political developments, including those related to international conflict and cooperation, in some societies in different regions of the world and at different times since the nineteenth century (FOCUS ON: Change and Continuity; Historical Perspective)","D3: Work and Economies: explain how various economic developments affected the development of two or more societies in different regions of the world and at different times since the nineteenth century (FOCUS ON: Cause and Consequence; Continuity and Change)","D4: Culture and Heritage: analyse the significance of various trends and developments related to culture and heritage in two or more societies in different regions of the world and at different times since the nineteenth century (FOCUS ON: Historical Significance; Historical Perspective)"]},"CHT3O":{"t":"World History since 1900 - Global and Regional Interactions, Grade 11, Open","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of world history since 1900","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse some significant social, economic, and political developments in two or more regions of the world between 1900 and 1919 (FOCUS ON: Historical Significance; Continuity and Change)","B2: Communities, Conflict, and Cooperation: analyse the significance of some global and regional conflicts and reform movements between 1900 and 1919 (FOCUS ON: Historical Significance; Cause and Consequence)","B3: Identity, Citizenship, and Heritage: explain how various political, social, and cultural developments affected identity, citizenship, and/or heritage in two or more regions of the world between 1900 and 1919 (FOCUS ON: Continuity and Change; Historical Perspective)","C1: Social, Economic, and Political Context: analyse the impact on the lives of people in two or more regions of the world of some key social, economic, and political issues, trends, and/or developments between 1919 and 1945 (FOCUS ON: Historical Significance; Continuity and Change)","C2: Communities, Conflict, and Cooperation: analyse key causes and consequences of various global and regional conflicts as well as the effectiveness of efforts to maintain peace between 1919 and 1945 (FOCUS ON: Cause and Consequence)","C3: Identity, Citizenship, and Heritage: analyse some significant developments related to human/citizenship rights and cultural identities in societies in two or more regions of the world between 1919 and 1945 (FOCUS ON: Historical Significance; Historical Perspective)","D1: Social, Economic, and Political Context: explain the impact of the lives of people in two or more regions of the world of some key social, economic, and political issues, trends, and/or developments between 1945 and 1991 (FOCUS ON: Continuity and Change; Historical Perspective)","D2: Communities, Conflict, and Cooperation: analyse various international and regional conflicts as well as forces that united communities between 1945 and 1991 (FOCUS ON: Cause and Consequence; Historical Perspective)","D3: Identity, Citizenship, and Heritage: explain how various social, political, and cultural forces affected identity, citizenship, and/or heritage in two or more regions of the world between 1945 and 1991 (FOCUS ON: Historical Significance; Continuity and Change)","E1: Social, Economic, and Political Context: analyse some key social, economic, and political issues and developments in two or more regions of the world since 1991 (FOCUS ON: Cause and Consequence; Historical Perspective)","E2: Communities, Conflict, and Cooperation: assess the impact of some key instances of conflict and international cooperation since 1991 (FOCUS ON: Historical Significance; Cause and Consequence)","E3: Identity, Citizenship, and Heritage: analyse how various factors have affected the rights, identity, and everyday lives of various groups in two of more regions of the world since 1991 (FOCUS ON: Continuity and Change; Historical Perspective)"]},"CHW3M":{"t":"World History to the End of the Fifteenth Century, Grade 11, University/College Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of world history to 1500","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Early Societies: analyse the evolution of early societies in various parts of the world, including factors that were necessary for their development (FOCUS ON: Cause and Consequence; Continuity and Change)","B2: Social, Economic, and Political Context: analyse key social, economic, and political structures and/or developments in three or more early societies and emerging cradles of civilization, each from a different region and a different period prior to 1500, and explain their impact on people's lives (FOCUS ON: Historical Significance; Historical Perspective)","B3: Cooperation, Conflict, and Rising Civilizations: analyse, with reference to specific early societies and emerging cradles of civilization, each from a different region and a different period prior to 1500, how interactions within and between societies contributed to the development of civilizations (FOCUS ON: Historical Significance; Continuity and Change)","C1: Social, Economic, and Political Context: analyse key social, economic, and political structures and developments in three or more flourishing societies/civilizations, each from a different region and a different period prior to 1500 (FOCUS ON: Historical Significance; Cause and Consequence)","C2: Stability and Expansion: analyse how various factors contributed to the stability, consolidation, and/or expansion of flourishing societies/civilizations from different regions and different periods prior to 1500 (FOCUS ON: Cause and Consequence; Continuity and Change)","C3: Identity, Citizenship, and Culture: assess the contributions of various individuals and groups to the development of identity, citizenship, and culture in three or more flourishing societies/civilizations, each from a different region and a different period prior to 1500 (FOCUS ON: Historical Significance; Historical Perspective)","D1: Social, Economic, and Political Context: explain the role of various social, economic, and political events and developments in the decline of three or more societies/civilizations, each from a different region and different period prior to 1500, and how these factors affected people living in these societies (FOCUS ON: Historical Significance; Cause and Consequence)","D2: Interrelationships: analyse how interrelationships with other societies and with the environment contributed to the decline of three or more societies/civilizations, each from a different region and different period prior to 1500 (FOCUS ON: Cause and Consequence; Continuity and Change)","D3: Cultural Characteristics and Identity: analyse aspects of culture and identity in three or more societies/civilizations in decline, each from a different region and different period prior to 1500 (FOCUS ON: Continuity and Change; Historical Perspective)","E1: Social, Cultural, and Political Heritage: analyse the socio-economic, cultural, and political legacies of societies/civilizations from three or more regions and from different periods prior to 1500 (FOCUS ON: Historical Significance; Continuity and Change)","E2: The Legacy of Interactions: analyse various types of interactions between societies prior to 1500 and how societies benefited from and were harmed by such interactions (FOCUS ON: Cause and Consequence; Historical Perspective)","E3: The Fifteenth-Century World: demonstrate an understanding of the general social, economic, and political context in societies in two or more regions of the world in the fifteenth century (FOCUS ON: Historical Significance; Historical Perspective)"]},"CHY4C":{"t":"World History since the Fifteenth Century, Grade 12, College Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of world history since the fifteenth century","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse key aspects of social, economic, and political systems in some societies in different regions of the world between 1450 and 1650 (FOCUS ON: Historical Significance; Historical Perspective)","B2: Communities, Conflict, and Cooperation: analyse how various factors affected interactions between groups in different regions of the world from 1450 to 1650 and how these interactions affected people's lives (FOCUS ON: Cause and Consequence; Historical Perspective)","B3: Identity, Citizenship, and Heritage: explain how some social, cultural, and political institutions and achievements contributed to the development of identity, citizenship, and/or heritage in different societies between 1450 and 1650 (FOCUS ON: Cause and Consequence; Continuity and Change)","C1: Social, Economic, and Political Context: analyse the impact of some key social, economic, and political developments in different regions of the world between 1650 and 1789 (FOCUS ON: Historical Significance; Continuity and Change)","C2: Communities, Conflict, and Cooperation: analyse various types of interactions between different groups from 1650 to 1789 and some forces that affected these interactions (FOCUS ON: Cause and Consequence; Historical Perspective)","C3: Identity, Citizenship, and Heritage: explain how some political, cultural, and religious developments contributed to identity, citizenship, and/or heritage in different regions of the world between 1650 and 1789 (FOCUS ON: Historical Significance)","D1: Social, Economic, and Political Context: explain the impact of some key social, economic, and political developments in different regions between 1789 and 1900, with a particular emphasis on the Industrial Revolution (FOCUS ON: Historical Significance; Cause and Consequence)","D2: Community, Conflict, and Cooperation: explain how war, revolution, reform, and other forces affected societies in different regions of the world between 1789 and 1900 (FOCUS ON: Cause and Consequence; Continuity and Change)","D3: Identity, Citizenship, and Heritage: explain how nationalism, immigration, and the contributions of some key political and cultural figures affected the development of identity, citizenship, and/or heritage in different regions of the world between 1789 and 1900 (FOCUS ON: Historical Significance; Historical Perspective)","E1: Social, Economic, and Political Context: analyse key aspects of dominant social, economic, and political systems in different regions of the world since 1900 (FOCUS ON: Historical Significance; Cause and Consequence)","E2: Communities, Conflict, and Cooperation: describe interactions between various groups since 1900, and explain how key individuals and some social, economic, and political forces have affected those interactions (FOCUS ON: Cause and Consequence; Historical Perspective)","E3: Identity, Citizenship, and Heritage: analyse some key changes in and contributions to identity, citizenship, and heritage in different regions of the world since 1900 (FOCUS ON: Historical Significance; Continuity and Change)"]},"CHY4U":{"t":"World History since the Fifteenth Century, Grade 12, University Preparation","o":["A1: Historical Inquiry: use the historical inquiry process and the concepts of historical thinking when investigating aspects of world history since the fifteenth century","A2: Developing Transferable Skills: apply in everyday contexts skills developed through historical investigation, and identify careers in which these skills might be useful","B1: Social, Economic, and Political Context: analyse key aspects of social, economic, and political systems and structures in various regions of the world between 1450 and 1650 (FOCUS ON: Historical Significance; Historical Perspective)","B2: Communities, Conflict, and Cooperation: analyse relations between different groups in various regions of the world from 1450 to 1650 and how various factors affected these relations (FOCUS ON: Cause and Consequence; Continuity and Change)","B3: Identity, Citizenship, and Heritage: analyse, with reference to the contributions of specific individuals, ways in which ideas, values, and artistic production affected the development of identity, citizenship, and/or heritage in various societies between 1450 and 1650 (FOCUS ON: Historical Significance; Cause and Consequence)","C1: Social, Economic, and Political Context: analyse key social, economic, and political issues, trends, and/or developments in various regions of the world between 1650 and 1789 (FOCUS ON: Cause and Consequence; Continuity and Change)","C2: Communities, Conflict, and Cooperation: analyse interactions between different groups in various regions of the world from 1650 to 1789 and how various forces/factors affected those interactions (FOCUS ON: Cause and Consequence; Historical Perspective)","C3: Identity, Citizenship, and Heritage: analyse how political, social, economic, religious, and cultural ideas and practices in various regions of the world between 1650 and 1789 contributed to the development of identity, citizenship, and/or heritage (FOCUS ON: Historical Significance; Historical Perspective)","D1: Social, Economic, and Political Context: analyse the impact of key social, economic, and political issues, trends, and/or developments in various regions of the world between 1789 and 1900 (FOCUS ON: Historical Significance; Cause and Consequence)","D2: Communities, Conflict, and Cooperation: assess how war, revolution, reform, and other forces affected societies in various regions of the world between 1789 and 1900 (FOCUS ON: Historical Significance; Continuity and Change)","D3: Identity, Citizenship, and Heritage: analyse how new ideas and other cultural, social, and political developments affected the development of identity, citizenship, and/or heritage in societies in various regions of the world between 1789 and 1900 (FOCUS ON: Continuity and Change; Historical Perspective)","E1: Social, Economic, and Political Context: analyse the significance of various social, economic, and political policies, developments, and ideas in various regions of the world since 1900 (FOCUS ON: Historical Significance; Cause and Consequence)","E2: Communities, Conflict, and Cooperation: analyse interactions between various groups since 1900 and how key individuals and social, economic, and political forces have affected those interactions (FOCUS ON: Cause and Consequence; Historical Perspective)","E3: Identity, Citizenship, and Heritage: analyse the development of the rights, identity, and heritage of different groups around the world since 1900 (FOCUS ON: Continuity and Change; Historical Perspective)"]},"CIA4U":{"t":"Analysing Current Economic Issues, Grade 12, University Preparation","o":["A1: Economic Inquiry: use the economic inquiry process and the concepts of economic thinking when investigating current Canadian and international economic issues","A2: Developing Transferable Skills: apply in everyday contexts skills developed through economic investigation, and identify various careers in which a background in economics might be an asset","B1: Scarcity and Choice: demonstrate an understanding of the significance of the concept of scarcity and how it influences economic choices and decisions of various economic stakeholders (FOCUS ON: Economic Significance; Stability and Variability)","B2: Supply and Demand Models: demonstrate an understanding of supply and demand models, including how to apply these models, and of factors that affect supply and demand (FOCUS ON: Cause and Effect; Stability and Variability)","B3: Growth and Sustainability: analyse aspects of economic growth/development, including its costs, benefits, and sustainability (FOCUS ON: Cause and Effect; Economic Perspective)","B4: Economic Thought and Decision Making: analyse how economic and political ideas and various sociocultural factors affect economic decision making (FOCUS ON: Economic Significance; Economic Perspective)","C1: The Firm and Market Structures: demonstrate an understanding of markets and theories of the firm (FOCUS ON: Cause and Effect; Stability and Variability)","C2: Economic Trade-Offs and Decisions: analyse economic trade-offs from the perspective of different stakeholders, including those in different countries, and how trade-offs influence economic decisions (FOCUS ON: Economic Significance; Economic Perspective)","C3: The Role of Government in Redressing Imbalance: explain ways in which governments, both in Canada and internationally, intervene in the economy to help address social needs and economic imbalances (FOCUS ON: Stability and Variability; Economic Perspective)","D1: Macroeconomic Models and Measures: demonstrate an understanding of various macroeconomic models and measures, including indicators used to measure economic inequalities, and assess their usefulness (FOCUS ON: Stability and Variability; Economic Perspective)","D2: Fiscal Policy: demonstrate an understanding of fiscal policy in Canada, including how it is shaped and its impact (FOCUS ON: Economic Significance; Cause and Effect)","D3: Monetary Policy: analyse various aspects of monetary policy in Canada and their impact on the economy (FOCUS ON: Cause and Effect; Economic Perspective)","E1: Theories and Models of International Trade: analyse various theories, models, and issues relating to international trade (FOCUS ON: Economic Significance; Stability and Variability)","E2: International Economic Developments: analyse the impact of some key international economic events and developments as well as various responses to them (FOCUS ON: Stability and Variability; Economic Perspective)","E3: International Economic Power and Inequality: explain the main causes and effects of global economic disparities and assess the effectiveness of responses to these disparities (FOCUS ON: Cause and Effect; Economic Perspective)"]},"CIC4E":{"t":"Making Personal Economic Choices, Grade 12, Workplace Preparation","o":["A1: Economic Inquiry: use the economic inquiry process and the concepts of economic thinking when investigating economic issues, including those related to personal economic choices","A2: Developing Transferable Skills: apply in everyday contexts skills developed through economic investigation, and identify some careers in which a background in economics might be an asset","B1: Financial Goals and Financial Planning: explain how various factors can affect individuals' financial plans and goals (FOCUS ON: Cause and Effect; Economic Perspective)","B2: Savings, Credit, and Debt: demonstrate an understanding of some key considerations relating to savings, credit, and debt (FOCUS ON: Economic Significance; Cause and Effect)","B3: Taxes and Government Expenditures: explain some ways in which governments in Canada raise revenue, with particular emphasis on personal income tax, and analyse the purpose of government expenditures (FOCUS ON: Economic Significance; Stability and Variability)","C1: Scarcity and Choice: demonstrate an understanding of scarcity and some other key economic concepts, and analyse how they affect economic decision making (FOCUS ON: Economic Significance; Stability and Variability)","C2: Understanding the Canadian Economy: demonstrate an understanding of some economic concepts and how they are related to key aspects of the Canadian economy (FOCUS ON: Stability and Variability; Economic Perspective)","C3: The Role of Labour: analyse the role of labour in the Canadian economy (FOCUS ON: Cause and Effect; Economic Perspective)","C4: Stakeholders' Views on Economic Issues: analyse a variety of economic issues from the perspectives of different stakeholders (FOCUS ON: Stability and Variability; Economic Perspective)","D1: Market Fundamentals: analyse, with reference to both producers and consumers, how a variety of factors affect markets (FOCUS ON: Cause and Effect; Economic Perspective)","D2: Rights and Responsibilities of Consumers: describe key rights and responsibilities of consumers, as well as some significant aspects of consumer behaviour, and analyse their signi
