gies that contribute to success in various settings","A2: Literacy and Numeracy Skills and Strategies: apply appropriate literacy and numeracy skills and strategies to support learning and planning for postsecondary choices","A3: Planning for Learning: analyse their learning skills and styles to determine their learning strengths and needs, and develop strategies to maximize their learning while in secondary school and throughout their lives","B1: Applying Personal-Management Skills: identify and apply the personal-management skills and strategies that contribute to success in a variety of settings","B2: Impact of Personal Factors: explain the impact of personal factors on achievement and apply strategies for personal improvement","B3: Interpersonal Skills: apply the interpersonal skills and strategies required to achieve success in reaching goals in a variety of settings","C1: Trends: demonstrate knowledge of selected workplace trends in order to make decisions about postsecondary choices and pathways","C2: Opportunities: apply research and career-exploration strategies to identify postsecondary options","C3: Learning Environments and Resources: identify and describe the learning environments and resources available to support lifelong learning","D1: Transition Skills: evaluate their own transition skills and strategies, and identify those requiring improvement","D2: Work Search: demonstrate the skills and strategies needed to prepare for the work search process","D3: Planning for Transition: demonstrate effective use of decision-making, goal-setting, and action-planning skills and strategies to prepare for transition to their first postsecondary destination"]},"GLE4O":{"t":"Advanced Learning Strategies - Skills for Success After Secondary School, Grade 12, Open","o":["A1: Learning and Thinking Strategies: evaluate learning skills and strategies that contribute to success in various settings","A2: Literacy and Numeracy Skills and Strategies: apply appropriate liter ed workplace settings","A3: Using Learning and Thinking Strategies: demonstrate effective use of learning and thinking strategies in school and in real or simulated workplace settings","A4: Developing Workplace Essential Skills: plan for, assess, and document their ongoing development and demonstration of selected workplace essential skills","B1: Self-Knowledge: demonstrate an understanding of their interests, strengths, and needs, and describe how these influence their postsecondary education, training, and career plans","B2: Working With Others: identify and describe self-management and teamwork skills and strategies, and use them effectively in working with others in real or simulated workplace settings","B3: Resource Management: identify and effectively apply strategies for managing time, planning tasks, and managing personal finances","C1: Researching Information: demonstrate the ability to research information about learning and work opportunities, using print, electronic, and human resources","C2: Exploring Learning and Work Opportunities: describe occupations of interest and the postsecondary education or training required for these occupations","C3: Understanding the Workplace: demonstrate an understanding of the nature of work and of workplace expectations and issues","C4: Demonstrating Health and Safety Awareness: identify, explain, and follow health and safety policies and procedures in school and in the workplace","D1: Managing Change: identify the possible changes they will encounter in the transition from secondary school to their first postsecondary destination, and develop strategies and resources to manage this transition","D2: Planning for Learning and Work: produce plans for a smooth transition to their selected postsecondary destination","D3: Searching for Work: apply job-search strategies, tools, and resources to find or create opportunities for work and for learning about work"]},"GLS4O":{"t":"Advanced Learning Strategies - Skills for Success ers in leadership and peer support roles","A2: Leadership Qualities: identify the characteristics of an effective leader and use these to evaluate their own leadership and peer support capabilities","A3: Personal Management: identify and apply the personal-management skills and characteristics required to succeed in leadership and peer support roles","A4: Strategies and Resources: identify and apply effective teaching and learning strategies and resources to help others through leadership and peer support roles","B1: Interpersonal Relations: use strategies that promote positive interpersonal relationships as they pertain to leadership and/or peer support","B2: Communication Skills: demonstrate effective use of communication skills in a variety of settings","B3: Group Dynamics: apply theories related to group dynamics and leadership in various situations","B4: Connecting With the Community: explain how community dynamics affect leadership and peer support roles","C1: Accessing Options: describe, on the basis of research, the range of leadership and peer support opportunities in the school and the community, and identify those to which they are most suited","C2: Developing a Plan: demonstrate the ability to design and implement a plan or program that addresses needs identified in the school or the community","C3: Exploring Careers: identify a range of careers and postsecondary options requiring skills in leadership and peer support"]},"GWL3O":{"t":"Designing Your Future, Grade 11, Open","o":["A1: Self-Knowledge: analyse their personal characteristics, strengths, interests, skills, and competencies to determine career-related goals","A2: Portfolio Development: maintain a portfolio for use in career planning that provides up-to-date evidence of knowledge, skills, interests, and experience","A3: Personal Management: demonstrate an understanding of the personal-management skills, habits, and characteristics that could contribute to success in their selected postsecondary ing: determine circle properties and solve related problems, including those arising from real-world applications"]},"MCV4U":{"t":"Calculus and Vectors, Grade 12, University Preparation","o":["A1: Investigating Instantaneous Rate: demonstrate an understanding of rate of change by making connections between average rate of change over an interval and instantaneous rate of change at a point, using the slopes of secants and tangents and the concept of the limit","A2: Investigating the Concept of the: graph the derivatives of polynomial, sinusoidal, and exponential functions, and make connections between the numeric, graphical, and algebraic representations of a function and its derivative","A3: Investigating the Properties of: verify graphically and algebraically the rules for determining derivatives; apply these rules to determine the derivatives of polynomial, sinusoidal, exponential, rational, and radical functions, and simple combinations of functions; and solve related problems","B1: Connecting Graphs and Equations: make connections, graphically and algebraically, between the key features of a function and its first and second derivatives, and use the connections in curve sketching","B2: solve problems, including optimization problems, that require the use of the concepts and procedures associated with the derivative, including problems arising from real-world applications and involving the development of mathematical models","C1: Representing Vectors Geometrically: demonstrate an understanding of vectors in two-space and three-space by representing them algebraically and geometrically and by recognizing their applications","C2: Operating With Vectors: perform operations on vectors in two-space and three-space, and use the properties of these operations to solve problems, including those arising from real-world applications","C3: Describing Lines and Planes Using: distinguish between the geometric representations of a single linear equation or a system of two line uage patterns","B1: demonstrate comprehension of written works","B2: read a variety of written works to gather information about cultural perspectives","B3: demonstrate an understanding of an Aboriginal world view through an analysis of words","B4: use electronic technology to communicate in a Native language with other students","C1: use an expanded vocabulary and varied language patterns correctly and apply spelling strategies effectively","C2: demonstrate an understanding of language conventions in their writing","C3: produce a variety of written works, such as short essays, letters, narratives, transcriptions of legends and oral prose, and biographies","C4: independently revise and edit their writing for accuracy of language use","C5: use electronic technology to communicate in a Native language with other students"]},"LNAAO-LNOAO":{"t":"Native Languages, Level 1, Open","o":["A1: demonstrate basic listening skills","A2: converse on familiar topics in structured situations","A3: demonstrate an understanding of language structures and vocabulary in context","A4: demonstrate an awareness of Native oral traditions (e.g., Native legends, stories, songs)","A5: use information technology to communicate in a Native language","B1: read simple material on familiar topics in structured situations","B2: recognize language patterns and vocabulary that have been learned through oral work","B3: read for comprehension of ideas","B4: demonstrate an understanding of language conventions and vocabulary in simple texts","B5: use information technology to communicate in a Native language","C1: use a variety of simple and compound sentences","C2: write on familiar topics, expressing ideas clearly","C3: demonstrate accuracy in writing and a knowledge of linguistic conventions","C4: use information technology to communicate in a Native language"]},"LNABO-LNOBO":{"t":"Native Languages, Level 2, Open","o":["A1: demonstrate a range of listening skills","A2: converse on familiar topics in : Relating Science to Technology, Society, and the Environment: analyse the effects of various human activities on the diversity of living things","B2: Developing Skills of Investigation and Communication: investigate, through laboratory and/or field activities or through simulations, the principles of scientific classification, using appropriate sampling and classification techniques","B3: Understanding Basic Concepts: demonstrate an understanding of the diversity of living organisms in terms of the principles of taxonomy and phylogeny","C1: Relating Science to Technology, Society, and the Environment: analyse the economic and environmental advantages and disadvantages of an artificial selection technology, and evaluate the impact of environmental changes on natural selection and endangered species","C2: Developing Skills of Investigation and Communication: investigate evolutionary processes, and analyse scientific evidence that supports the theory of evolution","C3: Understanding Basic Concepts: demonstrate an understanding of the theory of evolution, the evidence that supports it, and some of the mechanisms by which it occurs","D1: Relating Science to Technology, Society, and the Environment: evaluate the importance of some recent contributions to our knowledge of genetic processes, and analyse social and ethical implications of genetic and genomic research","D2: Developing Skills of Investigation and Communication: investigate genetic processes, including those that occur during meiosis, and analyse data to solve basic genetics problems involving monohybrid and dihybrid crosses","D3: Understanding Basic Concepts: demonstrate an understanding of concepts, processes, and technologies related to the transmission of hereditary characteristics","E1: Relating Science to Technology, Society, and the Environment: analyse the relationships between changing societal needs, technological advances, and our understanding of internal systems of humans","E2: Developing Skills r family, and of how they can maintain their health and well-being","D2: Family Responsibilities: describe the functions and responsibilities of families and the diverse ways in which families fulfil them","D3: Consumer Awareness: describe and demonstrate responsible consumer practices"]},"HIP4O":{"t":"Personal Life Management, Grade 12, Open","o":["A1: Exploring: explore topics related to personal life management, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Progressing From Adolescence to Adulthood: demonstrate an understanding of the personal qualities and skills necessary to make the transition from adolescence to adulthood","B2: Planning for Employment: describe the elements of successful planning for employment","B3: Communicating Effectively: demonstrate an understanding of effective communication skills and their role in building the healthy relationships that support independent living","C1: Making Decisions: demonstrate an understanding of effective decision-making processes and their role in independent living","C2: Managing Financial Resources: explain and demonstrate the use of basic money-management skills and techniques needed to manage personal financial resources effectively","C3: Managing a Household: describe and demonstrate the use of basic principles and techniques of effective household management","D1: Personal Responsibilities: demonstrate an understanding of the role of personal responsibility in independent living, and of strategies that can be used to meet individual needs","D2: Workplace Rights and Responsibilities: demonstrate an understanding of the rights and responsibilities of employers and employees, including both personal and legal responsibilities","D3: Consumer Rights and Responsibilities: demonstrate an understanding of the role that responsible consumerism plays in living independently","E1: Economic Influences: demonstrate an understanding of how global, national, and community economic factors affect the individual's financial circumstances","E2: Financial Institutions: describe ways in which financial institutions can assist in the management of personal finances","E3: Benefits and Costs of Working: explain the benefits and costs of working"]},"HLS3O":{"t":"Housing and Home Design, Grade 11, Open","o":["A1: Exploring: explore topics related to housing and home design, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Housing and Human Needs: demonstrate an understanding of the relationship between housing and various human needs and wants","B2: Homelessness and Inadequate Housing: explain what happens to people when their housing needs are not met, and demonstrate an understanding of laws and policies related to housing standards in Canada","B3: Housing and the Life Cycle: demonstrate an understanding of how stages of the life cycle can affect people's choice of and modifications to living spaces","C1: The Impact of Social Factors: demonstrate an understanding of the impact that social factors, including cultural traditions, can have on housing","C2: Housing for Specialized Markets: demonstrate an understanding of different types of housing, including housing for specialized markets, and of","C3: Economic and Legal Considerations: considerations associated with housing","D1: Functional Floor Plans: demonstrate the ability to create and evaluate floor plans for living spaces","D2: Design and Furnishing Considerations: demonstrate an understanding of the elements and principles of design and other considerations related to designing and decorating living spaces","D3: Home Maintenance: demonstrate an understanding of the importance of home maintenance and of ways to create a safe and healthy home","D4: Career Opportunities in Housing: describe various careers associated with housing, including home maintenance and design, and the educational pathways related to them"]},"HNB4M":{"t":"The World of Fashion, Grade 12, University/College Preparation","o":["A1: Exploring: explore topics related to fashion, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Fashion History: demonstrate an understanding of the impact on fashion of historical and technological developments and social issues","B2: Fashion Influences: demonstrate an understanding of the influence of brands, designers, and design centres on the fashion industry","C1: Clothing for Specialized Markets: demonstrate an understanding of the needs of specialized markets with regard to fashion/clothing","C2: Global Textile Production: demonstrate an understanding of global textile production and its social and environmental impact","C3: Globalization and Social Responsibility: demonstrate an understanding of the impact of globalization on the fashion industry and of strategies for reducing the negative impact of the industry","D1: Elements and Principles of Design: analyse the use of the elements and principles of design in fashion, and apply them when creating fashion products","D2: Tools and Technologies: describe the function and use of a variety of tools and technologies associated with the creation of fashion products, and use tools and technologies safely and correctly when creating such products","D3: Procedures, Skills, and Techniques: describe a wide range of procedures, skills, and techniques used in the creation of fashion products, and demonstrate the ability to use appropriate procedures, skills, and techniques when creating fashion products"]},"HNC3C":{"t":"Understanding Fashion, Grade 11, College Preparation","o":["A1: Exploring: explore topics related to fashion, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Cultural Influences: demonstrate an understanding of how culture influences fashion","B2: Media Influences: demonstrate an understanding of how media influence fashion","B3: Fashion Cycles and Trends: demonstrate an understanding of fashion cycles and trends and of factors that influence them","C1: Consumer Behaviour and Fashion Marketing: demonstrate an understanding of consumer behaviour and marketing strategies, including specific social marketing promotions, associated with the fashion industry","C2: Fibres, Fabrics, and the Environment: demonstrate an understanding of fibres, fabrics, and finishes, and of the environmental impact associated with their production and use","D1: Elements and Principles of Design: demonstrate an understanding of the elements and principles of design, and of how they can be used to different effect in the creation of fashion products","D2: Tools and Technologies: describe a variety of tools and technologies associated with the creation of fashion products, and use tools and technologies safely and correctly when creating such products","D3: Procedures, Skills, and Techniques: demonstrate the ability to use appropriate procedures, skills, and techniques when creating fashion products"]},"HNL2O":{"t":"Clothing, Grade 10, Open","o":["A1: Exploring: explore topics related to clothing, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: The Functions and Social Impact of Clothing: demonstrate an understanding of the functions clothing serves, the kinds of messages it conveys, and the impact it can have on social interactions","B2: Wardrobe Planning and Clothing Selection: demonstrate an understanding of various factors affecting personal wardrobe planning and clothes selection","C1: Evaluating Clothing: demonstrate an understanding of how to evaluate the quality, value, and suitability of clothing and accessories","C2: Retail Approaches: demonstrate an understanding of the effects that retail formats and promotions can have on individuals' decisions about clothing purchases","C3: Fibres and Fabric Care: demonstrate an understanding of natural and synthetic fibres and fabrics, and of how their characteristics affect clothing choices and care","D1: Elements of Design: describe the elements of design related to clothing and accessories, and explain how an awareness of these elements can affect personal clothing choices","D2: Tools and Technologies: identify a variety of tools and technologies associated with the creation of clothing and accessories, and use tools and technologies safely and correctly when creating and/or repairing clothing and accessories","D3: Procedures, Skills, and Techniques: demonstrate the ability to use appropriate procedures, skills, and techniques to create and repair clothing or accessories"]},"HPC3O":{"t":"Raising Healthy Children, Grade 11, Open","o":["A1: Exploring: explore topics related to child development and child rearing, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Pregnancy, Birth, and Postnatal Care: describe factors that contribute to the healthy development of children before and during birth, and in the first few months after birth","B2: Growth and Development: Stages and Influences: describe patterns in the healthy, social, emotional, cognitive, linguistic, and physical development of young children","B3: Infant and Child Nutrition: demonstrate an understanding of the importance of nutrition for healthy development","C1: Preparing for Parenting: demonstrate an understanding of how to prepare for the responsibilities of being a parent","C2: Communicating With Young Children: demonstrate an understanding of strategies parents can use to ensure effective communication in their families","C3: Applying Child-Rearing Knowledge and Skills: apply and assess their child-rearing knowledge and skills through practical experiences with children","D1: Family Variations: demonstrate an understanding of social and cultural variations in family forms and child-rearing approaches","D2: Parenting Styles and Practices: demonstrate an understanding of a variety of child-rearing practices and their effects on children","D3: Common and Diverse Experiences of Childhood: demonstrate an understanding of common and diverse experiences of young children in a variety of cultures and historical periods","E1: Caregiving Challenges in the Early Years: demonstrate an understanding of the challenges facing parents throughout the early childhood years","E2: Neglect and Abuse: describe strategies for building healthy family relationships in order to prevent neglect and/or physical, sexual, or emotional abuse of children","E3: Society's Role in the Lives of Children and Families: describe the roles and responsibilities of society in protecting and supporting children and families, and the responsibilities of caregivers towards children"]},"HPD4C":{"t":"Working With School-Age Children and Adolescents, Grade 12, College Preparation","o":["A1: Exploring: explore topics related to school-age children and adolescents, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Patterns of Development: demonstrate an understanding of patterns of social, emotional, cognitive, and physical development in school-age children and adolescents","B2: Theories of Development: demonstrate an understanding of various influential theories about child and adolescent development","B3: Positive Environments for Development: demonstrate an understanding of how developmentally appropriate environments and experiences promote healthy development","C1: Career Pathways: identify various postsecondary education and/or training opportunities, workplaces, and professional development options related to working with school-age children and adolescents","C2: Workplace Expectations: explain the legal and social workplace expectations related to working with school-age children and adolescents in Ontario","C3: Essential Skills and Personal Qualities: describe the essential skills, personal qualities, and work habits necessary for success in working with school-age children and adolescents","D1: Guiding Children's Behaviour: describe a broad range of practices and techniques adopted by parents, educators, caregivers, and other professionals that shape the behaviour of school-age children and adolescents","D2: Planning Developmentally Appropriate Programming: demonstrate the ability to plan developmentally appropriate programs for school-age children and adolescents","D3: Refining Skills through Practical Experiences: apply and evaluate their knowledge of child and youth development through practical experiences with school-age children and adolescents","E1: Issues and Challenges: demonstrate an understanding of a variety of strategies for helping school-age children and adolescents deal with issues and challenges","E2: Neglect and Abuse: demonstrate an understanding of the responsibilities of people who work with school-age children and adolescents in dealing with issues related to abuse, neglect, and family violence","E3: Social and Cultural Variations: demonstrate an understanding of how a variety of social and cultural factors affect school-age children and adolescents"]},"HPW3C":{"t":"Working With Infants and Young Children, Grade 11, College Preparation","o":["A1: Exploring: explore topics related to early childhood education, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Patterns in Infant and Child Development: demonstrate an understanding of patterns of social, emotional, cognitive, linguistic, and physical development in infants and children from birth to six years of age","B2: Theories of Child Development: demonstrate an understanding of a variety of influential theories about child development","B3: Positive Environments for Development: demonstrate an understanding of how developmentally appropriate environments and experiences promote healthy development in children","C1: Education and Professional Development: describe postsecondary destinations, workplaces, and professional development opportunities in early childhood education","C2: Workplace Expectations: explain the legal and social workplace expectations for employment in early childhood education in Ontario","C3: Essential Skills and Personal Qualities: demonstrate an understanding of the essential skills, personal qualities, and work habits necessary for success in early childhood education","D1: Guiding Children's Behaviour: demonstrate an understanding of theories and strategies related to child behaviour, and effectively use a range of strategies and skills when working with children from birth to six years of age","D2: Developmentally Appropriate Programs and Environments: demonstrate an understanding of the elements of developmentally appropriate programs and environments for children from birth to six years of age","D3: Refining Skills through Practical Experiences: apply and evaluate their knowledge of child development through practical experiences with children","E1: Issues and Challenges: demonstrate an understanding of a variety of issues and challenges that early childhood educators encounter","E2: Neglect and Abuse: demonstrate an understanding of factors that contribute to neglect and physical, sexual, and emotional abuse and of the roles of early childhood educators in dealing with these issues","E3: Social and Cultural Variations: demonstrate an understanding of how a variety of social and cultural factors affect young children"]},"HRF3O":{"t":"World Religions and Belief Traditions in Daily Life, Grade 11, Open","o":["A1: Exploring: explore topics related to world religions and belief traditions, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science and humanities research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Commonalities: demonstrate an understanding of the commonalities among various world religions and belief traditions that coexist within a diverse society","B2: Terms and Concepts: define and appropriately use terms and concepts related to world religions and belief traditions, examining their meaning in the context of various beliefs","B3: Global and Local Contexts: demonstrate an understanding of global and local contexts in which world religions and belief traditions function","C1: Historical Contexts: demonstrate an understanding of the historical contexts that have shaped particular religions and belief traditions","C2: Community Beliefs and Practices: demonstrate an understanding of various ways in which adherents of particular world religions and belief traditions relate to their own and other communities","C3: Belief Traditions and Popular Culture: demonstrate an understanding of ways in which various world religions and belief traditions are interpreted and adapted within popular culture","D1: Festivals, Celebrations, and Commemorations: demonstrate an understanding of the role and significance of festivals, celebrations, and commemorations in various world religions and belief traditions","D2: Rites of Passage: describe the role and significance of rites of passage in various world religions and belief traditions","D3: Daily Observances: describe and explain the function and significance of the daily observances practised by followers of various world religions and belief traditions","E1: Role of Sacred Writings, Oral Teachings, and Stories: demonstrate an understanding of the role of sacred writings, oral teachings, and stories in various world religions and belief traditions","E2: Influence of Sacred Writings, Oral Teachings, and Stories: demonstrate an understanding of the influence of sacred writings, oral teachings, and stories on the development of belief and action","F1: Sacred Time: demonstrate an understanding of how concepts of time influence the teachings and practices of various world religions and belief traditions","F2: Sacred Place: demonstrate an understanding of how concepts of place influence the teachings and practices of various world religions and belief traditions"]},"HRT3M":{"t":"World Religions and Belief Traditions - Perspectives, Issues, and Challenges, Grade 11, University/College Preparation","o":["A1: Exploring: explore topics related to world religions and belief traditions, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Why Study World Religions and Belief Traditions?: demonstrate an understanding of various reasons for the study of world religions and belief traditions","B2: Terms and Concepts in the Study of the Sacred: demonstrate an understanding of terms and concepts related to the study of world religions and belief traditions","B3: Approaches: demonstrate an understanding and assess the strengths and weaknesses of various approaches to the study of world religions and belief traditions","C1: Functions of Human Belief Traditions: explain some of the ways people use religions and belief traditions to meet human needs","C2: The Search for Meaning: analyse ways in which various religions and belief traditions conceptualize the journey of life as a spiritual journey and quest for meaning","D1: Tenets, Practices, and Teachings: outline the central tenets, practices, and teachings of various religions and belief traditions","D2: Sacred Writings and Oral Teachings: analyse the role of sacred writings and oral teachings in various religions and belief traditions","D3: Prescribed Roles and Influential Figures: analyse how individuals with specific roles have influenced the development of various religions and belief traditions","E1: Daily Living as Sacred Reality: demonstrate an understanding of the type of daily observances associated with various religions and belief traditions and of the role of these observances in the lives of adherents","E2: Rites and Rituals: demonstrate an understanding of the ways in which rituals and rites reflect the understandings and principles of various religions and belief traditions","F1: Cultural Contexts: identify and analyse ways in which various religions and belief traditions are embodied in cultural forms","F2: Social Contexts: analyse the interaction between society and various religions and belief traditions","F3: Social Challenges: demonstrate an understanding of the challenges that adherents of various religions and belief systems experience in society","F4: Religion, Civil Society, and Popular Culture: describe and analyse ways in which various religions and belief traditions are interpreted and adapted within civil society and popular culture"]},"HSB4U":{"t":"Challenge and Change in Society, Grade 12, University Preparation","o":["A1: Exploring: explore topics related to the analysis of social change, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Foundations for the Study of Social Change: demonstrate an understanding of the major theories, perspectives, and methodologies related to social change","B2: Causes and Effects of Social Change: demonstrate an understanding of the causes and effects of social change","B3: Technological Change: demonstrate an understanding of patterns and effects of technological change from a social science perspective","C1: Demographics: demonstrate an understanding of the importance of demographics as a tool for studying social patterns and trends, both nationally and globally","C2: Forces That Shape Social Trends: demonstrate an understanding of how forces influence and shape social patterns and trends","C3: Social Deviance: demonstrate an understanding of social science theories about social deviance, and of how various responses to deviance affect individuals and society","D1: Global Inequalities: demonstrate an understanding of how various social structures and conditions support or limit global inequalities","D2: Globalization: assess the impact of globalization on individuals and groups","D3: Exploitation: analyse the impact of unfair or unjust exploitation of people or resources, locally and globally"]},"HSC4M":{"t":"World Cultures, Grade 12, University/College Preparation","o":["A1: Exploring: explore topics related to world cultures and/or cultural groups, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Understanding Culture: demonstrate an understanding of the elements and functions of culture and of the nature of cultural influence","B2: Cultural Dynamics: analyse how cultural identities are socially constructed, preserved, transmitted, and transformed","B3: Theoretical Analysis of Culture: demonstrate an understanding of theories and concepts related to the study of culture, and apply these theories to analyse various cultures","C1: Art, Philosophy, and Religion: demonstrate an understanding of artistic expressions, philosophies, and religious/spiritual beliefs found within specific cultures, and of how these expressions relate to various aspects of those cultures","C2: Cultural Expressions in Context: analyse specific cultural expressions and a range of factors that can affect them","C3: Contributions and Influences: assess the contributions to and influence on various cultures/societies, including Canada, of a diverse range of ethnocultural groups and individuals from those groups","D1: Power Relations: demonstrate an understanding of the dynamics of power relations within specific cultural groups and between minority and majority cultures","D2: Policies and Issues: demonstrate an understanding of past and present policies and issues affecting cultural diversity in Canada, and compare approaches to such policy in Canada with those in other countries","D3: Social Action and Personal Engagement: design, implement, and evaluate an initiative to address an issue related to cultural groups or promoting cultural diversity"]},"HSE3E":{"t":"Equity, Diversity, and Social Justice, Grade 11, Workplace Preparation","o":["A1: Exploring: explore topics related to equity, diversity, and/or social justice, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: The Social Construction of Identity: demonstrate an understanding of how identity is socially constructed and internalized, and of the impact of social norms and stereotypes","B2: Power Relations: demonstrate an understanding of the dynamics of power relations in various social contexts","B3: Social Awareness and Individual Action: demonstrate an understanding of the impact individual action can have on equity, social justice, and environmental issues, and of how the media can create awareness of these issues","C1: Ethnocultural Diversity in Canada: describe challenges faced by various racial, cultural, and national communities in Canada and the contributions these communities have made to this country","C2: Equity and Social Justice in Canada: demonstrate an understanding of a range of historical and contemporary Canadian equity and social justice issues","C3: Social Activism: demonstrate an understanding of how social activism can be used to support equity and social justice objectives","D1: Respecting Diversity: demonstrate an understanding of how to interact successfully in settings characterized by diversity, including school, workplace, and community settings, and ways to promote respect for diversity in these settings","D2: Human Rights, Equity, and Antidiscrimination: demonstrate an understanding of their rights and responsibilities relating to equity and human rights, and of how to appropriately address situations involving discrimination, harassment, and the denial of rights","D3: Social Action and Personal Engagement: design, implement, and evaluate an initiative to address an equity or social justice issue"]},"HSE4M":{"t":"Equity and Social Justice - From Theory to Practice, Grade 12, University/College Preparation","o":["A1: Exploring: explore topics related to equity and social justice, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topic, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Approaches and Perspectives: demonstrate an understanding of a range of perspectives on and approaches to equity and social justice issues, and of factors that affect inequity and social injustice","B2: Power Relations: analyse, in historical and contemporary contexts, the dynamics of power relations and privilege as well as various factors that contribute to power or marginalization","B3: Media and Popular Culture: assess the impact of media and popular culture on equity and social justice issues","C1: Historical and Contemporary Issues: analyse a range of historical and contemporary equity and social justice issues and the impact of economic and environmental factors on these issues","C2: Leadership: evaluate the contributions of individuals and groups and/or movements identified with specific aspects of the struggle for equity and social justice","C3: Policies, Strategies, and Initiatives: compare policies, strategies, and initiatives used by various groups, including indigenous peoples and women, to address equity and social justice issues in a variety of jurisdictions","D1: Promoting Equity and Social Justice: demonstrate an understanding of how personal values, knowledge, and actions can contribute to equity and social justice, and assess strategies that people use to address equity and social justice concerns","D2: Opportunities for Participation: describe a variety of careers and volunteer opportunities in fields related to equity and social justice, and demonstrate an understanding of the skills and knowledge they require","D3: Social Action and Personal Engagement: design, implement, and evaluate an initiative to address an equity or social justice issue"]},"HSG3M":{"t":"Gender Studies, Grade 11, University/College Preparation","o":["A1: Exploring: explore topics related to gender studies, and formulate questions to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: The Social Construction of Gender: demonstrate an understanding of how attitudes, behaviours, roles, and norms relating to gender are socially constructed, and of the complexity of gender as a concept and as a lived experience","B2: Power Relations, Sex, and Gender: analyse sexism and the dynamics of power relations with respect to sex and gender in a variety of contexts","B3: Representations of Gender: analyse representations of women and men in media, popular culture, and the arts, and assess the effects of these representations","C1: Securing Rights and Social Supports: demonstrate an understanding of concerns and objectives of women's rights movements and men's movements, and explain issues related to the rights of sexual minorities","C2: Local and Global Challenges: analyse a range of social, political, economic, and environmental issues relating to gender in Canadian and global contexts","C3: Gender-Based Violence and Its Prevention: demonstrate an understanding of homophobic and gender-based violence in both Canadian and global contexts, and of violence-prevention strategies","D1: Changes in the Workplace: demonstrate an understanding of changes in occupations and the workplace with respect to gender issues, and of the reasons for continuing occupational segregation","D2: Agents of Change: describe strategies, initiatives, and accomplishments of individuals and organizations, including both Canadian and international organizations, with respect to gender equity","D3: Social Action and Personal Engagement: design, implement, and evaluate an initiative to address an issue related to gender equity or gender-based violence awareness/prevention"]},"HSP3C":{"t":"Introduction to Anthropology, Psychology, and Sociology, Grade 11, College Preparation","o":["A1: Exploring: explore topics related to anthropology, psychology, and sociology, and formulate questions appropriate for each discipline to guide their research","A2: Investigating: create research plans, and locate and select information relevant to their chosen topics, using appropriate social science research and inquiry methods","A3: Processing Information: assess, record, analyse, and synthesize information gathered through research and inquiry","A4: Communicating and Reflecting: communicate the results of their research and inquiry clearly and effectively, and reflect on and evaluate their research, inquiry, and communication skills","B1: Theories, Perspectives, and Methodologies: demonstrate an understanding of major theories, perspectives, and research methods in anthropology","B2: Explaining Human Behaviour and Culture: use an anthropological perspective to explain how diverse factors influence and shape human behaviour and culture","B3: Socialization: use a cultural anthropology perspective to explain patterns of human socialization","C1: Theories, Perspectives, and Methodologies: demonstrate an understanding of major theories, perspectives, and research methods in psychology","C2: Human Mental Processes and Behaviour: use a psychological perspective to describe how diverse factors influence and shape human mental processes and behaviour","C3: Socialization: use a psychological perspective to explain patterns of socialization","D1: Theories, Perspectives, and Methodologies: demonstrate an understanding of major theories, perspectives, and research methods in sociology","D2: Explaining Social Behaviour: use a sociol itions of major philosophers and schools of philosophy with respect to some of these questions","F2: Exploring the Philosophy of Science: demonstrate an understanding of theories in the philosophy of science, and evaluate responses to some of the main questions in the philosophy of science by major philosophers and schools of philosophy","F3: Making Connections to the Philosophy of Science: demonstrate an understanding of connections between the philosophy of science and other areas of philosophy, other subject areas, and various aspects of society, including everyday life","F4: Philosophical Reasoning in the Philosophy of Science: use philosophical reasoning skills to develop, communicate, and defend their own responses to questions in the philosophy of science","G1: Understanding Social and Political Philosophy: demonstrate an understanding of the main questions in social and political philosophy, and of the positions of major philosophers and schools of philosophy with respect to some of these questions","G2: Exploring Social and Political Philosophy: demonstrate an understanding of theories in social and political philosophy, and evaluate responses to some of the main questions in social and political philosophy by major philosophers and schools of philosophy","G3: Making Connections to Social and Political Philosophy: demonstrate an understanding of connections between social and political philosophy and other areas of philosophy, other subject areas, and various aspects of society, including everyday life","G4: Philosophical Reasoning in Social and Political Philosophy: use philosophical reasoning skills to develop, communicate, and defend their own responses to questions in social and political philosophy","H1: Understanding Aesthetics: demonstrate an understanding of the main questions in aesthetics, and of the positions of major philosophers and schools of philosophy with respect to some of these questions","H2: Exploring Aesthetics: demonstrate an understa ious careers related to computer technology and electronics, and the entry requirements for these careers"]},"TEJ4E":{"t":"Computer Technology, Grade 12, Workplace Preparation","o":["A1: Computer Hardware: describe the function and development of a variety of current computer hardware","A2: Networking Concepts: describe network topologies, devices, and connection media as well as common user network requirements","A3: Software: describe various types of software, analyse software needs, and evaluate available software","B1: Hardware Solutions: determine and report on hardware solutions for user computing needs","B2: Installation, Maintenance, and Troubleshooting: install, maintain, and troubleshoot computer hardware, and design backup procedures","B3: Network Setup and Management: install, configure, manage, maintain, and troubleshoot computer networks and related services","B4: Software Implementation: install, configure, and update a variety of software","C1: Technology and the Environment: describe environmental issues related to the widespread use of computer technology, and apply strategies to reduce environmental harm from computer use","C2: Technology and Society: analyse societal issues related to the widespread use of computer technology","D1: Health and Safety: explain and follow computer-related safety standards and practices","D2: Ethics and Security: describe ethical and security issues related to the use of computers","D3: Customer Service: demonstrate an understanding of professional customer-service practices","D4: Workplace Skills: apply the skills required for success in the workplace","D5: Career Opportunities: describe opportunities for careers and training related to computer technology, and explain the need for lifelong learning in the computer technology industry"]},"TEJ4M":{"t":"Computer Engineering Technology, Grade 12, University/College Preparation","o":["A1: Computer Hardware: demonstrate an understanding of internal buses and storage dev re: describe procedures for the proper care and maintenance of the interior and exterior of a vehicle","B4: Information,Tools, and Equipment for Basic Service and Maintenance: identify appropriate repair information and the tools and equipment required for safe basic service and maintenance of a vehicle","C1: Using Service Information: demonstrate an understanding of service information and the importance of vehicle identification and information labels when performing vehicle maintenance and repair","C2: Engine Service: perform basic engine and related system service following the owner's manual guidelines and appropriate service information sources, and identify system components that need to be professionally serviced","C3: General Vehicle Maintenance and Service: perform general vehicle maintenance and service as recommended in the owner's manual and outlined in appropriate service information sources, and identify system components that need to be professionally serviced","D1: Technology and the Environment: explain how vehicle ownership affects the environment and how vehicle owners can remedy or reduce harmful effects","D2: Technology and Society: explain how vehicle ownership and various aspects of the transportation industry affect society","E1: Health and Safety: demonstrate an understanding of and compliance with occupational health and safety regulations and standards related to vehicle maintenance","E2: Career Opportunities: identify and describe career opportunities in the transportation industry and the education and training required for these careers"]},"TTJ4C":{"t":"Transportation Technology, Grade 12, College Preparation","o":["A1: Understanding Engine Management Systems: demonstrate an understanding of the operation of engine management systems","A2: Understanding Power Transfer Devices: demonstrate an understanding of the principles of operation of power transfer devices","A3: Troubleshooting the Powertrain: demonstrate an understanding of troub
